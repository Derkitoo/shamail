                    ${chapter.sharh ? `
                    <div class="relative z-10">
                        <button onclick="toggleSharh('${chapterKey}', event)" class="w-full flex items-center justify-between py-1.5 px-1 text-slate-500 hover:text-madinah-600 dark:text-slate-400 dark:hover:text-madinah-400 transition-colors text-xs sm:text-sm font-bold">
                            <span class="flex items-center gap-1.5"><i data-lucide="lightbulb" class="w-4 h-4 text-amber-500"></i> ${appData.ui.sharhBtn[state.lang]}</span>
                            <i data-lucide="chevron-down" id="sharh-icon-${chapterKey}" class="w-4 h-4 transition-transform duration-300"></i>
                        </button>
                        <div id="sharh-${chapterKey}" class="sharh-content">
                            <div class="p-4 mt-1.5 bg-indigo-50/60 dark:bg-indigo-900/20 rounded-xl border border-indigo-100/80 dark:border-indigo-800/30 text-slate-700 dark:text-slate-300 font-scaled-sharh ${isRtl ? `border-r-4 border-r-indigo-500 ${fontClass}` : 'border-l-4 border-l-indigo-500'}">
                                ${chapter.sharh[state.lang]}
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    ${chapter.action ? `
                    <div class="bg-amber-50/80 dark:bg-amber-900/20 p-3.5 rounded-xl border border-amber-200/50 dark:border-amber-800/30 flex items-start gap-2.5">
                        <div class="bg-amber-100 dark:bg-amber-900/50 p-1 rounded-md shrink-0 mt-0.5">
                            <i data-lucide="zap" class="w-4 h-4 text-amber-600 dark:text-amber-400"></i>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider block mb-0.5">${appData.ui.sunnahAction[state.lang]}</span>
                            <p class="text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300 ${isRtl ? fontClass : ''}">${chapter.action[state.lang]}</p>
                        </div>
                    </div>
                    ` : ''}

                    <div class="flex items-center gap-2 pt-3 border-t border-slate-100 dark:border-slate-700/50">
                        <button onclick="toggleRead('${chapterKey}', event)" class="flex-1 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all active:scale-95 ${isRead ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800' : 'bg-slate-50 text-slate-500 hover:bg-slate-100 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700'}">
                            <i data-lucide="${isRead ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>
                            ${appData.ui.markRead[state.lang]}
                        </button>
                        <button onclick="generateHadithCard('${chapterKey}', event)" title="Générer Carte Hadith" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 flex items-center justify-center transition-all active:scale-95">
                            <i data-lucide="image" class="w-4.5 h-4.5"></i>
                        </button>
                        <button onclick="toggleFavorite('${chapterKey}', event)" title="Favoris" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all active:scale-95 ${isFav ? 'bg-rose-100 text-rose-500 dark:bg-rose-900/50 dark:text-rose-400 border border-rose-200 dark:border-rose-800' : 'bg-slate-50 text-slate-400 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700'}">
                            <i data-lucide="heart" class="w-4.5 h-4.5 ${isFav ? 'fill-current' : ''}"></i>
                        </button>
                        <button onclick="shareChapter('${chapterKey}', event)" title="Partager Texte" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 flex items-center justify-center transition-all active:scale-95">
                            <i data-lucide="share-2" class="w-4.5 h-4.5"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function saveBookmark(chapterKey) {
            state.lastBookmark = chapterKey;
            localStorage.setItem('shamail_last_bookmark', chapterKey);
        }

        function renderDictionary() {
            const isRtl = state.lang === 'ar';
            let filteredDict = appData.dictionary;

            if (state.dictQuery && state.dictQuery.trim() !== '') {
                const q = state.dictQuery.toLowerCase();
                filteredDict = filteredDict.filter(d => 
                    d.word.toLowerCase().includes(q) || 
                    d.def.fr.toLowerCase().includes(q) || 
                    d.def.ar.includes(q)
                );
            }

            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="text-center mb-6 pt-2">
                        <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-100 dark:bg-emerald-900/50 flex items-center justify-center mb-3 text-emerald-600 dark:text-emerald-400 shadow-md">
                            <i data-lucide="book-marked" class="w-7 h-7"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white font-arabicTitle mb-1">Gharîb al-Hadîth (غرائب الألفاظ)</h2>
                        <p class="text-slate-500 dark:text-slate-400 font-medium text-xs">Le dictionnaire des termes rares et complexes</p>
                    </div>

                    <div class="relative mb-5">
                        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" oninput="handleDictSearch(event)" value="${state.dictQuery}" placeholder="Rechercher un mot (ex: الممغط, القرفصاء...)" class="w-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border border-slate-200/80 dark:border-slate-700/80 rounded-2xl py-2.5 pl-10 pr-4 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-madinah-500 shadow-sm">
                    </div>

                    <div class="space-y-3.5">
            `;

            if (filteredDict.length === 0) {
                html += `<div class="text-center py-10 text-slate-400"><i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p class="font-medium text-xs">Aucun terme trouvé.</p></div>`;
            } else {
                filteredDict.forEach((item) => {
                    const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === item.chapterKey);
                    html += `
                        <div class="bg-white/90 dark:bg-slate-800/95 backdrop-blur-xl p-4.5 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm hover:shadow-md transition-all">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xl font-bold font-arabicTitle text-emerald-600 dark:text-emerald-400">${item.word}</span>
                                <span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[10px] font-bold uppercase tracking-wider">${item.type}</span>
                            </div>
                            <p class="text-sm font-medium text-slate-700 dark:text-slate-200 mb-1.5">${item.def.fr}</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-arabic mb-3">${item.def.ar}</p>
                            ${chapter ? `
                                <button onclick="setView('group', '${chapter.group_id}')" class="text-xs font-bold text-madinah-600 dark:text-madinah-400 hover:underline flex items-center gap-1">
                                    <i data-lucide="link" class="w-3.5 h-3.5"></i> Voir le chapitre: ${chapter.title[state.lang]}
                                </button>
                            ` : ''}
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            getEl('app-content').innerHTML = html;
        }

        function handleDictSearch(e) {
            state.dictQuery = e.target.value;
            renderDictionary();
            lucide.createIcons();
        }

        /* HTML5 Canvas Hadith Image Generator */
        function generateHadithCard(chapterKey, e) {
            if (e) e.stopPropagation();
            const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === chapterKey);
            if (!chapter) return;

            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
            grad.addColorStop(0, '#064e3b');
            grad.addColorStop(1, '#022c22');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1080);

            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 10;
            ctx.strokeRect(40, 40, 1000, 1000);

            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 44px Amiri, serif';
            ctx.textAlign = 'center';
            ctx.fillText('ﷺ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ وَسَلِّمْ', 540, 130);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Amiri, serif';
            ctx.fillText(chapter.title.fr, 540, 220);

            ctx.fillStyle = '#ecfdf5';
            ctx.font = '34px Cairo, sans-serif';
            wrapCanvasText(ctx, chapter.content.fr, 540, 330, 900, 50);

            let dalilClean = chapter.dalil.fr.replace(/<[^>]*>?/gm, '');
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'italic 28px Inter, sans-serif';
            wrapCanvasText(ctx, dalilClean, 540, 680, 880, 42);

            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 26px Inter, sans-serif';
            ctx.fillText("— Shamâ'il Muhammadiyya", 540, 980);

            const dataUrl = canvas.toDataURL('image/png');
            state.currentGeneratedImageData = dataUrl;

            const modalImg = getEl('card-preview-img');
            const downloadBtn = getEl('card-download-btn');
            if (modalImg) modalImg.src = dataUrl;
            if (downloadBtn) downloadBtn.href = dataUrl;

            openCardModal();
        }

        function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line.trim(), x, currentY);
        }

        function openCardModal() {
            const modal = getEl('card-modal');
            const content = getEl('card-modal-content');
            if (!modal || !content) return;
            modal.classList.remove('modal-closed');
            modal.classList.add('modal-open');
            setTimeout(() => content.classList.remove('scale-95'), 10);
        }

        function closeCardModal() {
            const modal = getEl('card-modal');
            const content = getEl('card-modal-content');
            if (!modal || !content) return;
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('modal-open');
                modal.classList.add('modal-closed');
            }, 180);
        }

        function shareCardImage() {
            if (navigator.share && state.currentGeneratedImageData) {
                fetch(state.currentGeneratedImageData)
                    .then(res => res.blob())
                    .then(blob => {
                        const file = new File([blob], 'hadith-shamail.png', { type: 'image/png' });
                        navigator.share({
                            title: "Hadith Shamâ'il",
                            files: [file]
                        }).catch(() => showToast("Image téléchargée !"));
                    });
            } else {
                showToast("Téléchargement de l'image...");
            }
        }

        function toggleSharh(chapterKey, e) {
            if (e) e.stopPropagation();
            const content = getEl(`sharh-${chapterKey}`);
            const icon = getEl(`sharh-icon-${chapterKey}`);
            if (!content || !icon) return;

            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function toggleFavorite(chapterKey, e) {
            if (e) e.stopPropagation();
            const idx = state.favorites.indexOf(chapterKey);
            if (idx > -1) {
                state.favorites.splice(idx, 1);
                showToast(appData.ui.removed[state.lang]);
            } else {
                state.favorites.push(chapterKey);
                showToast(appData.ui.saved[state.lang]);
            }
            localStorage.setItem('shamail_favorites', JSON.stringify(state.favorites));
            render();
        }

        function toggleRead(chapterKey, e) {
            if (e) e.stopPropagation();
            const idx = state.readChapters.indexOf(chapterKey);
            if (idx > -1) {
                state.readChapters.splice(idx, 1);
            } else {
                state.readChapters.push(chapterKey);
            }
            localStorage.setItem('shamail_read', JSON.stringify(state.readChapters));
            render();
        }

        function shareChapter(chapterKey, e) {
            if (e) e.stopPropagation();
            const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === chapterKey);
            if (!chapter) return;

            let dalilClean = chapter.dalil[state.lang].replace(/<[^>]*>?/gm, '');
            const text = `✨ ${chapter.title[state.lang]}\n\n📖 ${chapter.content[state.lang]}\n\n📜 ${appData.ui.proof[state.lang]}: ${dalilClean}\n\n— Shamâ'il App`;
            
            if (navigator.share) {
                navigator.share({ title: chapter.title[state.lang], text: text }).catch(() => {
                    copyToClipboard(text);
                });
            } else {
                copyToClipboard(text);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(appData.ui.copied[state.lang]);
            }).catch(() => {
                showToast(appData.ui.copied[state.lang]);
            });
        }

        function renderFavorites() {
            const isRtl = state.lang === 'ar';
            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="text-center mb-6 pt-2">
                        <div class="w-14 h-14 mx-auto rounded-full bg-rose-100 dark:bg-rose-900/50 flex items-center justify-center mb-3 text-rose-500">
                            <i data-lucide="heart" class="w-7 h-7 fill-current"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white font-arabicTitle">${appData.ui.favorites[state.lang]}</h2>
                    </div>
                    <div class="space-y-4">
            `;
            
            if (state.favorites.length === 0) {
                html += `<div class="text-center py-10 text-slate-400"><i data-lucide="heart-off" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p class="font-medium text-xs">${appData.ui.noFavorites[state.lang]}</p></div>`;
            } else {
                state.favorites.forEach((key, index) => {
                    const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === key);
                    if (chapter) {
                        const group = appData.groups.find(g => g.id === chapter.group_id);
                        html += generateChapterCard(chapter, group, index, isRtl);
                    }
                });
            }
            html += `</div></div>`;
            getEl('app-content').innerHTML = html;
        }

        function renderQuiz() {
            const isRtl = state.lang === 'ar';
            
            if (state.quizFinished) {
                let celebrateMsg = "Excellent travail ! Vous maîtrisez les Shamâ'il prophétiques.";
                if (state.quizScore < 3) celebrateMsg = "Bon effort ! Continuez votre lecture pour enrichir vos connaissances.";

                let html = `
                    <div class="animate-fade-in flex flex-col items-center justify-center min-h-[65vh] py-4 text-center">
                        <div class="w-20 h-20 rounded-full bg-gradient-to-br from-violet-400 to-fuchsia-600 flex items-center justify-center text-white shadow-xl mb-4 animate-bounce-short">
                            <i data-lucide="trophy" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white font-arabicTitle mb-1">Quiz Terminé !</h2>
                        <p class="text-slate-500 dark:text-slate-400 font-medium text-xs mb-5 max-w-xs">${celebrateMsg}</p>
                        
                        <div class="bg-white/90 dark:bg-slate-800/90 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-lg mb-6 w-full max-w-xs">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Votre Score Final</span>
                            <span class="text-3xl font-black text-violet-600 dark:text-violet-400 font-mono">${state.quizScore} / ${appData.quiz.length}</span>
                        </div>

                        <button onclick="resetQuiz()" class="px-7 py-3 rounded-full bg-gradient-to-r from-violet-500 to-fuchsia-600 text-white font-bold text-xs hover:scale-105 active:scale-95 transition-all shadow-lg flex items-center gap-2">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Recommencer le Quiz
                        </button>
                    </div>
                `;
                getEl('app-content').innerHTML = html;
                lucide.createIcons();
                return;
            }

            const quizItem = appData.quiz[state.quizIndex];
            state.quizFlipped = false;

            let html = `
                <div class="animate-fade-in flex flex-col items-center justify-center min-h-[65vh] py-3">
                    <div class="text-center mb-5">
                        <h2 class="text-xl font-black text-slate-800 dark:text-white mb-0.5 flex items-center justify-center gap-1.5 font-arabicTitle"><i data-lucide="brain" class="w-5 h-5 text-violet-500"></i> ${appData.ui.quizTitle[state.lang]}</h2>
                        <div class="flex items-center justify-center gap-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                            <span>Question ${state.quizIndex + 1} / ${appData.quiz.length}</span>
                            <span>•</span>
                            <span class="text-emerald-600 dark:text-emerald-400">Score: ${state.quizScore}</span>
                        </div>
                    </div>
                    
                    <div class="w-full max-w-sm h-60 perspective-1000 mb-5 cursor-pointer" onclick="flipCard(event)">
                        <div id="quiz-card" class="flip-card-inner">
                            <div class="flip-card-front bg-gradient-to-br from-violet-500 to-fuchsia-500 p-5 flex flex-col items-center justify-center text-center shadow-xl border border-white/20">
                                <i data-lucide="help-circle" class="w-10 h-10 text-white/50 mb-3"></i>
                                <p class="text-lg font-bold text-white font-arabicTitle leading-relaxed">${quizItem.q[state.lang]}</p>
                            </div>
                            <div class="flip-card-back bg-white dark:bg-slate-800 p-5 flex flex-col items-center justify-center text-center shadow-xl border border-slate-200 dark:border-slate-700">
                                <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500 mb-3"></i>
                                <p class="text-lg font-bold text-slate-800 dark:text-white font-arabicTitle leading-relaxed">${quizItem.a[state.lang]}</p>
                            </div>
                        </div>
                    </div>

                    <div id="quiz-actions" class="flex flex-col items-center gap-2.5 w-full max-w-sm">
                        <button onclick="flipCard(event)" class="w-full py-2.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold hover:scale-105 active:scale-95 transition-all shadow-sm">${appData.ui.flipBtn[state.lang]}</button>
                        
                        <div id="quiz-score-buttons" class="hidden flex gap-2.5 w-full">
                            <button onclick="answerQuiz(false)" class="flex-1 py-2.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-1">
                                🔄 À revoir
                            </button>
                            <button onclick="answerQuiz(true)" class="flex-1 py-2.5 rounded-full bg-emerald-500 text-white text-xs font-bold hover:bg-emerald-600 active:scale-95 transition-all shadow-md flex items-center justify-center gap-1">
                                ✅ Je savais (+1)
                            </button>
                        </div>
                    </div>
                </div>
            `;
            getEl('app-content').innerHTML = html;
        }

        function flipCard(e) {
            if (e) e.stopPropagation();
            state.quizFlipped = !state.quizFlipped;
            const card = getEl('quiz-card');
            const scoreBtns = getEl('quiz-score-buttons');
            if (card) {
                if (state.quizFlipped) {
                    card.classList.add('flipped');
                    if (scoreBtns) scoreBtns.classList.remove('hidden');
                } else {
                    card.classList.remove('flipped');
                    if (scoreBtns) scoreBtns.classList.add('hidden');
                }
            }
        }

        function answerQuiz(correct) {
            if (correct) state.quizScore++;
            if (state.quizIndex + 1 >= appData.quiz.length) {
                state.quizFinished = true;
            } else {
                state.quizIndex++;
            }
            renderQuiz();
        }

        function resetQuiz() {
            state.quizIndex = 0;
            state.quizScore = 0;
            state.quizFinished = false;
            state.quizFlipped = false;
            renderQuiz();
        }

        function setView(view, groupId = null) {
            state.view = view;
            state.activeGroupId = groupId;
            render();
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = getEl('toast');
            const toastMsg = getEl('toast-msg');
            if (!toast || !toastMsg) return;

            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        // Initialize App
        window.onload = init;
    </script>
</body>
</html>
