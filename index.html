            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 7px 11px;

            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s ease;

            line-height: 1.35;
            width: max-content;
            max-width: 220px;

            chapters: [
                /* Group: Apparence */
                { group_id: 'apparence', bab: 1, title: { fr: "Ses traits physiques", ar: "خلقه ﷺ" }, content: { fr: "Il n'était ni trop grand ni trop petit. Il avait les épaules larges, un beau visage éclatant comme la pleine lune.", ar: "لم يكن بالطويل الممغط ولا بالقصير المتردد. يتلألأ وجهه تلألؤ القمر ليلة البدر." }, dalil: { fr: "D'après Al-Barâ' ibn 'Âzib (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ était de taille moyenne, avec des épaules larges et une chevelure abondante. Je n'ai jamais vu quelqu'un de plus beau que lui dans un vêtement rouge. »", ar: "عن البراء بن عازب قال: «كان رسول الله ﷺ مربوعاً، بعيد ما بين المنكبين، له شعر يبلغ شحمة أذنيه، رأيته في حلة حمراء ما رأيت شيئاً قط أحسن منه»" }, auth: 'sahih', sharh: { fr: "L'Imam Al-Bajuri explique que le terme 'Rab'a' dénote la juste mesure et la perfection des proportions physiques du Prophète ﷺ.", ar: "قال الإمام الباجوري: (مربوعاً) أي وسطاً بين الطول والقصر، وكان وجهه الشريف يستنير كالقمر ليلة البدر." }, action: { fr: "Gardez une posture droite et humble.", ar: "حافظ على هيئة معتدلة ووقار." } },
                { group_id: 'apparence', bab: 2, title: { fr: "Le sceau de la prophétie", ar: "خاتم النبوة" }, content: { fr: "Une excroissance de chair entre les épaules, marque promise de la prophétie.", ar: "غدة حمراء مثل بيضة الحمامة بين كتفيه." }, dalil: { fr: "D'après Jâbir ibn Samoura (qu'Allah l'agrée) : « J'ai vu le Sceau de la Prophétie entre les épaules du Messager d'Allah ﷺ, c'était une excroissance de chair rouge de la taille d'un œuf de pigeon. »", ar: "عن جابر بن سمرة قال: «رأيت الخاتم بين كتفي رسول الله ﷺ غدة حمراء مثل بيضة الحمامة...»" }, auth: 'sahih', sharh: { fr: "Une marque physique annoncée dans les Écritures antérieures pour reconnaître le dernier des Prophètes.", ar: "علامة نبوته المبشر بها في الكتب السابقة." } },
                { group_id: 'apparence', bab: 3, title: { fr: "Ses cheveux", ar: "شعره ﷺ" }, content: { fr: "Ondulés, atteignant mi-oreilles ou le col.", ar: "ليس بالسبط ولا بالجعد، يبلغ شحمة أذنيه." }, dalil: { fr: "D'après Anas ibn Mâlik (qu'Allah l'agrée) : « Les cheveux du Messager d'Allah ﷺ étaient légèrement ondulés, ni complètement lisses ni crépus, et ils tombaient entre ses oreilles et ses épaules. »", ar: "عن أنس بن مالك رضي الله عنه قال: «كان شعر رسول الله ﷺ رجلاً، ليس بالسبط ولا الجعد، بين أذنيه وعاتقه»" }, auth: 'sahih' },
                { group_id: 'apparence', bab: 4, title: { fr: "Le peignage de ses cheveux", ar: "ترجيل شعره ﷺ" }, content: { fr: "Il soignait et peignait ses cheveux régulièrement.", ar: "كان يترجل بالماء والدهن." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « J'aimais peigner les cheveux du Messager d'Allah ﷺ en commençant toujours par le côté droit. »", ar: "عن عائشة قالت: «كنت أرجل رأس رسول الله ﷺ... وكان يعجبه التيمّن في طهوره وترجّله»" }, auth: 'sahih' },
                { group_id: 'apparence', bab: 5, title: { fr: "Ses cheveux blancs", ar: "شيبه ﷺ" }, content: { fr: "Moins de 20 cheveux blancs sur la tête et la barbe.", ar: "لم يكن في رأسه ولحيته عشرون شعرة بيضاء." }, dalil: { fr: "D'après Anas ibn Mâlik (qu'Allah l'agrée) : « Je n'ai compté dans la tête et la barbe du Messager d'Allah ﷺ que quatorze cheveux blancs. »", ar: "عن أنس بن مالك قال: «ما عددت في رأس رسول الله ﷺ ولحيته إلا أربع عشرة شعرة بيضاء»" }, auth: 'sahih' },
                { group_id: 'apparence', bab: 6, title: { fr: "Sa teinture", ar: "خضابه ﷺ" }, content: { fr: "Il utilisait du henné doux pour nourrir la chevelure.", ar: "خضابه بالحناء والكتم." }, dalil: { fr: "D'après Abou Rimtha (qu'Allah l'agrée) : « Je suis venu trouver le Prophète ﷺ et j'ai vu que ses quelques cheveux blancs étaient teints d'une nuance rougeâtre au henné. »", ar: "عن أبي رمثة قال: «أتينا النبي ﷺ وعليه ثوبان أخضران، وله شعر قد تعلى خضاب بالحناء...»" }, auth: 'sahih' },
                { group_id: 'apparence', bab: 7, title: { fr: "Son kohl (Collyre)", ar: "كحله ﷺ" }, content: { fr: "Il appliquait de l'Ithmid trois fois par œil avant de dormir.", ar: "يكتحل بالأثمد ثلاثاً في كل عين." }, dalil: { fr: "D'après Ibn 'Abbâs (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ avait un flacon de kohl (Ithmid) dont il appliquait trois traits dans chaque œil avant d'aller dormir. »", ar: "عن ابن عباس قال: «كانت للنبي ﷺ مكحلة يكتحل منها كل ليلة ثلاثة في هذه وثلاثة في هذه»" }, auth: 'sahih' },

                /* Group: Vêtements */
                { group_id: 'vetements', bab: 8, title: { fr: "Ses vêtements et le Qamis", ar: "لباسه ﷺ" }, content: { fr: "Le vêtement le plus aimé était le Qamis blanc propre.", ar: "أحب الثياب إليه القميص الأبيض." }, dalil: { fr: "D'après Oum Salama (qu'Allah l'agrée) : « Le vêtement que le Messager d'Allah ﷺ préférait le plus porter était le Qamis (la chemise longue). »", ar: "عن أم سلمة قالت: «كان أحب الثياب إلى رسول الله ﷺ القميص»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 9, title: { fr: "Sa subsistance modeste", ar: "عيشه ﷺ" }, content: { fr: "Une vie simple, tournée vers l'au-delà.", ar: "زهد عيشه وإيثار الآخرة." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le lit sur lequel dormait le Messager d'Allah ﷺ était fait de cuir rembourré de fibres de palmier. »", ar: "عن عائشة قالت: «إنما كان فراش رسول الله ﷺ الذي ينام عليه من أدم حشوه ليف»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 10, title: { fr: "Ses chaussons (Khuffayni)", ar: "خفه ﷺ" }, content: { fr: "Des chaussons de cuir simples offerts par le Négus.", ar: "خفان أسودان أهداهما النجاشي." }, dalil: { fr: "D'après Bourayda (qu'Allah l'agrée) : « Le Négus (roi d'Abyssinie) a offert au Prophète ﷺ une paire de chaussons en cuir noir simples, qu'il a portés et sur lesquels il a fait l'essuyage (Mash). »", ar: "عن بريدة: «أن النجاشي أهدى للنبي ﷺ خفين أسودين فلبسهما وتوضأ ومسح عليهما»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 11, title: { fr: "Ses sandales", ar: "نعله ﷺ" }, content: { fr: "Sandales à deux lanières passants entre les orteils.", ar: "لهما قبالان يمران بين الأصابع." }, dalil: { fr: "D'après Anas ibn Mâlik (qu'Allah l'agrée) : « Les sandales du Messager d'Allah ﷺ avaient deux lanières passant entre les orteils. »", ar: "عن أنس قال: «كان لنعل رسول الله ﷺ قبالان»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 12, title: { fr: "Sa bague d'argent", ar: "خاتمه ﷺ" }, content: { fr: "Bague en argent servie de sceau diplomatique.", ar: "خاتم فضة نقشه محمد رسول الله." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « La bague du Prophète ﷺ était entièrement en argent, et son chaton était aussi en argent. »", ar: "عن أنس قال: «كان خاتم النبي ﷺ من فضة وكان فصه منه»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 13, title: { fr: "La gravure de sa bague", ar: "صياغة خاتمه ﷺ" }, content: { fr: "Gravée sur 3 lignes par respect du Nom d'Allah.", ar: "ثلاثة أسطر تعظيماً لله." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « L'inscription gravée sur la bague du Prophète ﷺ était : 'Muhammad' sur une ligne, 'Messager' sur une ligne, et 'Allah' sur une ligne. »", ar: "عن أنس قال: «كان نقش الخاتم ثلاثة أسطر: محمد سطر، ورسول سطر، والله سطر»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 14, title: { fr: "Le port de la bague", ar: "لبس الخاتم باليمين" }, content: { fr: "Portée à l'auriculaire de la main droite.", ar: "يختم في خنصره الأيمن." }, dalil: { fr: "D'après Ibn 'Umar (qu'Allah l'agrée) : « Le Prophète ﷺ portait sa bague à la main droite et mettait le chaton du côté de la paume. »", ar: "عن ابن عمر: «أن النبي ﷺ كان يلبس خاتمه في يمينه ويجعل فصه في باطن كفه»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 15, title: { fr: "Son épée", ar: "سيفه ﷺ" }, content: { fr: "La poignée de son épée était incrustée d'argent.", ar: "قبيعة سيفه فضة." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « La pomme de l'épée du Messager d'Allah ﷺ était ornée d'argent. »", ar: "عن أنس قال: «كانت قبيعة سيف رسول الله ﷺ من فضة»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 16, title: { fr: "Son armure", ar: "درعه ﷺ" }, content: { fr: "Deux cotte de mailles superposées lors d'Uhud.", ar: "ظاهر بين درعين يوم أحد." }, dalil: { fr: "D'après Al-Zubayr ibn al-'Awwâm (qu'Allah l'agrée) : « Le Prophète ﷺ portait deux cottes de mailles superposées lors de la bataille d'Uhud. »", ar: "عن الزبير بن العوام قال: «كان على النبي ﷺ يوم أحد درعان، فنهض إلى الصخرة فلم يستطع، فأقعد طلحة تحته فصعد عليه...»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 17, title: { fr: "Son casque (Mighfar)", ar: "مغفره ﷺ" }, content: { fr: "Entré à La Mecque portant un casque de fer.", ar: "دخل مكة وعلى رأسه المغفر." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « Le Prophète ﷺ est entré à La Mecque le jour de la Conquête portant un casque de fer (Mighfar) sur sa tête. »", ar: "عن أنس بن مالك: «أن النبي ﷺ دخل مكة عام الفتح وعلى رأسه المغفر»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 18, title: { fr: "Son turban ('Imama)", ar: "عمامته ﷺ" }, content: { fr: "Turban noir drapé avec l'extrémité tombant entre les épaules.", ar: "عمامة سوداء يرخي طرفها بين كتفيه." }, dalil: { fr: "D'après Ja'far ibn 'Amr (qu'Allah l'agrée) : « J'ai vu le Prophète ﷺ en chaire, coiffé d'un turban noir dont il laissait pendre l'extrémité entre ses épaules. »", ar: "عن جعفر بن عمرو عن أبيه قال: «رأيت النبي ﷺ على المنبر وعليه عمامة سوداء قد أرخى طرفها بين كتفيه»" }, auth: 'sahih' },
                { group_id: 'vetements', bab: 19, title: { fr: "Son loincloth (Izar)", ar: "إزاره ﷺ" }, content: { fr: "Porté à mi-mollet sans traîner au sol.", ar: "إزاره إلى نصف الساق." }, dalil: { fr: "D'après Abou Hurayra (qu'Allah l'agrée) : « L'Izar (vêtement du bas) du Messager d'Allah ﷺ s'arrêtait à mi-mollet, sans descendre en dessous des chevilles. »", ar: "عن أبي هريرة قال: «كان إزار رسول الله ﷺ إلى نصف الساق»" }, auth: 'sahih' },

                /* Group: Attitude */
                { group_id: 'attitude', bab: 20, title: { fr: "Sa démarche", ar: "مشيته ﷺ" }, content: { fr: "Energique, digne, s'avançant comme en descente.", ar: "تكفأ كأنما ينحط من صبب." }, dalil: { fr: "D'après Ali ibn Abî Tâlib (qu'Allah l'agrée) : « Quand le Prophète ﷺ marchait, il s'avançait avec force et énergie, inclinant son corps vers l'avant comme s'il descendait une pente douce. »", ar: "عن علي بن أبي طالب قال: «كان النبي ﷺ إذا مشى تكفأ تكفؤاً كأنما ينحط من صبب»" }, auth: 'sahih' },
                { group_id: 'attitude', bab: 21, title: { fr: "Son voile de tête", ar: "تقنعه ﷺ" }, content: { fr: "Il couvrait parfois sa tête d'un tissu léger.", ar: "يكثر التقنع فوق رأسه." }, dalil: { fr: "D'après Anas ibn Mâlik (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ couvrait souvent sa tête d'un tissu léger, au point que ce tissu prenait la couleur de l'huile de ses cheveux. »", ar: "عن أنس بن مالك قال: «كان رسول الله ﷺ يكثر القناع على رأسه حتى كأن ثوبه ثوب زيتّار»" }, auth: 'sahih' },
                { group_id: 'attitude', bab: 22, title: { fr: "Sa façon de s'asseoir", ar: "جلسته ﷺ" }, content: { fr: "Assis en Qurfusa ou en tailleur par humilité.", ar: "يجلس القرفصاء والمتربع." }, dalil: { fr: "D'après Qayla bint Makhrama (qu'Allah l'agrée) : « J'ai vu le Messager d'Allah ﷺ assis dans la mosquée en posture de Qurfusa (entourant ses genoux avec ses bras). En voyant son humilité profonde, j'ai tremblé de respect. »", ar: "عن قيلة بنت مخرمة قالت: «رأيت رسول الله ﷺ وهو قاعد القرفصاء... فلما رأيت رسول الله ﷺ المتنعم المتواضع أرعدت من الفروق»" }, auth: 'hasan' },
                { group_id: 'attitude', bab: 23, title: { fr: "Sa posture adossée", ar: "اتكاؤه ﷺ" }, content: { fr: "Adossé à un coussin sur le côté gauche.", ar: "متكئاً على وسادة." }, dalil: { fr: "D'après Jâbir ibn Samoura (qu'Allah l'agrée) : « J'ai vu le Prophète ﷺ adossé à un coussin posé sur son côté gauche. »", ar: "عن جابر بن سمرة قال: «رأيت النبي ﷺ متكئاً على وسادة على يساره»" }, auth: 'sahih' },
                { group_id: 'attitude', bab: 24, title: { fr: "Son appui sur autrui", ar: "استناده ﷺ" }, content: { fr: "Appuyé sur ses compagnons lorsqu'il était affaibli.", ar: "مستنداً إلى أصحابه في مرضه." }, dalil: { fr: "D'après Al-Fadl ibn 'Abbâs (qu'Allah l'agrée) : « Je suis entré chez le Prophète ﷺ durant sa dernière maladie, il avait la tête bandée et s'est appuyé sur mon bras pour sortir à la mosquée. »", ar: "عن الفضل بن عباس قال: «دخلت على رسول الله ﷺ في مرضه الذي توفي فيه، وعصابة على رأسه، فاستند إليّ حتى دخل المسجد...»" }, auth: 'sahih' },

                /* Group: Nourriture */
                { group_id: 'nourriture', bab: 25, title: { fr: "Sa façon de manger", ar: "صفة أكله ﷺ" }, content: { fr: "Il mangeait avec trois doigts et les léchait.", ar: "يأكل بثلاث أصابع ويلعقها." }, dalil: { fr: "D'après Ka'b ibn Mâlik (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ mangeait avec trois doigts (le pouce, l'index et le majeur) et les léchait proprement après le repas. »", ar: "عن كعب بن مالك قال: «كان رسول الله ﷺ يأكل بثلاث أصابع ويلعق يده قبل أن يمسحها»" }, auth: 'sahih' },
                { group_id: 'nourriture', bab: 26, title: { fr: "Son pain d'orge", ar: "خبزه ﷺ" }, content: { fr: "Pain d'orge grossier sans tamisage.", ar: "خبز الشعير غير المنخول." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « La famille de Muhammad ﷺ n'a jamais mangé à sa faim du pain d'orge deux jours consécutifs jusqu'à son décès. »", ar: "عن عائشة قالت: «ما شبع آل محمد ﷺ من خبز شعير يومين متتابعين حتى قبض»" }, auth: 'sahih' },
                { group_id: 'nourriture', bab: 27, title: { fr: "Ses condiments (Idam)", ar: "إدامه ﷺ" }, content: { fr: "Huile d'olive, vinaigre et la courge (Dubba').", ar: "نعم الإدام الخل والدباء." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « Un tailleur a invité le Prophète ﷺ. J'ai vu le Prophète rechercher les morceaux de courge (Dubba') dans le plat car il les aimait particulièrement. »", ar: "عن أنس قال: «دعَا رسولَ الله ﷺ خَياطٌ... فَرَأَيْتُ النبيَّ ﷺ يَتَتَبَّعُ الدُّبَّاءَ مِنْ حَوَالَيْ الصَّحْفَةِ»" }, auth: 'sahih' },
                { group_id: 'nourriture', bab: 28, title: { fr: "Lavage des mains au repas", ar: "وضوؤه عند الطعام" }, content: { fr: "Laver les mains avant et après le repas.", ar: "بركة الطعام الوضوء قبله وبعده." }, dalil: { fr: "D'après Salmân al-Fârisi (qu'Allah l'agrée) : « J'ai lu dans la Thora que la bénédiction du repas réside dans le lavage des mains après le repas. J'en ai parlé au Prophète ﷺ qui a dit : 'La bénédiction du repas réside dans le lavage des mains AVANT et APRÈS le repas'. »", ar: "عن سلمان قال: «قريت في التوراة أن بركة الطعام الوضوء بعده، فذكرت ذلك للنبي ﷺ فقال: بركة الطعام الوضوء قبله والوضوء بعده»" }, auth: 'hasan' },
                { group_id: 'nourriture', bab: 29, title: { fr: "Invocations du repas", ar: "تسميته على الطعام" }, content: { fr: "Dire Bismillah avant et Al-Hamdulillah après.", ar: "التسمية أوله والحمد آخره." }, dalil: { fr: "D'après Abou Umâma (qu'Allah l'agrée) : « Lorsque la table du Prophète ﷺ était débarrassée, il disait : 'Louange à Allah, une louange abondante, pure et bénie, sans pouvoir nous passer de Ses bienfaits'. »", ar: "عن أبي أمامة: «أن النبي ﷺ كان إذا رفعت مائدته قال: الحمد لله حمداً كثيراً طيباً مباركاً فيه...»" }, auth: 'sahih' },
                { group_id: 'nourriture', bab: 30, title: { fr: "Sa coupe à boire", ar: "قدحه ﷺ" }, content: { fr: "Une coupe en bois cerclée de fer.", ar: "قدح غليظ من خشب فيه حديد." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « J'ai conservé la coupe du Prophète ﷺ. C'était une coupe en bois d'arbre solide, réparée par un cercle de fer qu'Anas avait remplacé par un cerclage d'argent. »", ar: "عن أنس قال: «لقد سقيت رسول الله ﷺ بهذا القدح الشراب كله: الماء والنبيذ والعسل واللبن»" }, auth: 'sahih' },
                { group_id: 'nourriture', bab: 31, title: { fr: "Ses fruits", ar: "فاكهته ﷺ" }, content: { fr: "Il mangeait du melon frais avec des dattes mûres.", ar: "يأكل البطيخ بالرطب." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ mangeait le melon frais accompagné de dattes mûres et disait : 'La fraîcheur de ceci brise la chaleur de cela'. »", ar: "عن عائشة: «أن النبي ﷺ كان يأكل البطيخ بالرطب فيقول: نكسر حرّ هذا ببرد هذا، وبرد هذا بحرّ هذا»" }, auth: 'sahih' },
                { group_id: 'nourriture', bab: 32, title: { fr: "Sa boisson préférée", ar: "شرابه ﷺ" }, content: { fr: "L'eau fraîche et adoucie au miel ou au nabidh.", ar: "أحب الشراب إليه الحلو البارد." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « La boisson que le Messager d'Allah ﷺ préférait le plus était l'eau douce et fraîche. »", ar: "عن عائشة قالت: «كان أحب الشراب إلى رسول الله ﷺ الحلو البارد»" }, auth: 'sahih' },
                { group_id: 'nourriture', bab: 33, title: { fr: "Façon de boire", ar: "صفة شربه ﷺ" }, content: { fr: "Boire en 3 gorgées en respirant hors du verre.", ar: "يتنفس في الشراب ثلاثاً." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ respirait trois fois hors du récipient lorsqu'il buvait, disant que cela était plus désaltérant et meilleur pour la santé. »", ar: "عن أنس: «أن النبي ﷺ كان يتنفس في الشراب ثلاثاً ويقول: هو أروى وأبرأ وأمرأ»" }, auth: 'sahih' },

                /* Group: Parole */
                { group_id: 'parole', bab: 34, title: { fr: "Son amour du parfum", ar: "طيبه ﷺ" }, content: { fr: "Il aimait le parfum et ne le refusait jamais.", ar: "يحب الطيب ولا يرده." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ avait une boîte à parfum (Sukkah) dans laquelle il se parfumait régulièrement, et il ne refusait jamais le parfum offert. »", ar: "عن أنس قال: «كانت لرسول الله ﷺ سُكّة يتطيب منها... وكان لا يرد الطيب»" }, auth: 'sahih' },
                { group_id: 'parole', bab: 35, title: { fr: "Sa parole claire", ar: "كلامه ﷺ" }, content: { fr: "Parole distincte, rythmée, qu'on pouvait compter.", ar: "كلاماً بيّناً فصلاً لو عده العاد لأحصاه." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ ne parlait pas de manière précipitée comme vous le faites. Il parlait de façon distincte et mesurée, de sorte que quiconque l'écoutait pouvait retenir ses paroles. »", ar: "عن عائشة قالت: «ما كان رسول الله ﷺ يسرد كسرِدِكم هذا، ولكنه كان يتكلم بكلام بيّن فصل يحفظه من سمعه»" }, auth: 'sahih' },
                { group_id: 'parole', bab: 36, title: { fr: "Son rire et sourire", ar: "ضحكه ﷺ" }, content: { fr: "Son rire était un large sourire bienveillant.", ar: "كان جل ضحكه التبسم." }, dalil: { fr: "D'après Abdullâh ibn al-Hârith (qu'Allah l'agrée) : « Je n'ai vu personne sourire autant que le Messager d'Allah ﷺ. Son rire n'était le plus souvent qu'un large sourire. »", ar: "عن عبد الله بن الحارث قال: «ما رأيت أحداً أكثر تبسماً من رسول الله ﷺ... وما كان ضحكه إلا تبسماً»" }, auth: 'sahih' },
                { group_id: 'parole', bab: 37, title: { fr: "Son humour sincère", ar: "مزاحه ﷺ" }, content: { fr: "Il plaisantait sans jamais dire de mensonge.", ar: "يمازح ولا يقول إلا حقاً." }, dalil: { fr: "D'après Abou Hurayra (qu'Allah l'agrée) : « Les Compagnons ont dit : 'Ô Messager d'Allah, tu plaisantes avec nous !' Il répondit : 'Oui, mais je ne dis que la vérité stricte'. »", ar: "عن أبي هريرة قال: قالوا: يا رسول الله إنك تداعبنا! قال: «إني لا أقول إلا حقاً»" }, auth: 'sahih' },
                { group_id: 'parole', bab: 38, title: { fr: "La poésie", ar: "شعره ﷺ" }, content: { fr: "Il écoutait la bonne poésie louant la vérité.", ar: "يسمع الشعر الحسن ويستنشده." }, dalil: { fr: "D'après 'Amr ibn al-Sharîd (qu'Allah l'agrée) : « J'ai récité au Prophète ﷺ cent vers de la poésie d'Omayya ibn Abi al-Salt, et après chaque vers il me disait : 'Continue !' car ses poèmes contenaient des rappels sur l'Unicité d'Allah. »", ar: "عن عمرو بن الشريد عن أبيه قال: «أنشدت النبي ﷺ مائة قافية من شعر أمية بن أبي الصلت، كلما أنشدته بيتاً قال: هيه...»" }, auth: 'sahih' },
                { group_id: 'parole', bab: 39, title: { fr: "Ses récits nocturnes", ar: "سمره ﷺ" }, content: { fr: "Récits familiaux bienveillants (Hadith Umm Zar').", ar: "حديث أم زرع وسمره مع أهله." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le Prophète ﷺ racontait parfois des histoires morales à ses épouses la nuit pour réjouir leur cœur et leur enseigner la sagesse. »", ar: "عن عائشة قالت: «حدث رسول الله ﷺ ذات ليلة نساءه حديثاً... حديث خرافة وأم زرع»" }, auth: 'sahih' },

                /* Group: Adoration */
                { group_id: 'adoration', bab: 40, title: { fr: "Son sommeil", ar: "نومه ﷺ" }, content: { fr: "S'allonger sur le côté droit avec invocations.", ar: "ينام على شقه الأيمن ذاكراً لله." }, dalil: { fr: "D'après Hudhayfa (qu'Allah l'agrée) : « Quand le Prophète ﷺ s'allongeait dans son lit, il posait sa hand droite sous sa joue droite et disait : 'Ô Allah, c'est en Ton nom que je meurs et que je vis'. »", ar: "عن حذيفة قال: «كان النبي ﷺ إذا أوى إلى فراشه وضع يده تحت خده ثم قال: باسمك اللهم أموت وأحيا»" }, auth: 'sahih' },
                { group_id: 'adoration', bab: 41, title: { fr: "Sa prière nocturne", ar: "عبادته ﷺ" }, content: { fr: "Prier la nuit jusqu'à ce que ses pieds enflent.", ar: "يقوم الليل حتى تتفطر قدماه." }, dalil: { fr: "D'après Al-Mughîra ibn Shu'ba (qu'Allah l'agrée) : « Le Prophète ﷺ priait la nuit jusqu'à ce que ses pieds enflent. On lui dit : 'Pourquoi te peiner ainsi alors qu'Allah t'a tout pardonné ?' Il répondit : 'Ne serais-je pas un serviteur reconnaissant ?' »", ar: "عن المغيرة بن شعبة قال: «قام النبي ﷺ حتى تفطرت قدمَاه، فقيل له: أتكلف هذا وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ قال: أفلا أكون عبداً شكوراً؟»" }, auth: 'sahih' },
                { group_id: 'adoration', bab: 42, title: { fr: "La prière du matin (Duha)", ar: "صلاة الضحى" }, content: { fr: "Prier 4 rak'ats ou plus selon sa disponibilité.", ar: "صلاة الضحى أربع ركعات." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ accomplissait la prière du matin (Duha) en quatre rak'ats, et y ajoutait ce qu'Allah voulait. »", ar: "عن عائشة قالت: «كان رسول الله ﷺ يصلي الضحى أربع ركعات ويزيد ما شاء الله»" }, auth: 'sahih' },
                { group_id: 'adoration', bab: 43, title: { fr: "Prières à la maison", ar: "تطوعه في بيته" }, content: { fr: "Effectuer les Sunnan à la maison.", ar: "صلاة التطوع في بيته نور." }, dalil: { fr: "D'après Ibn 'Umar (qu'Allah l'agrée) : « J'ai accompli avec le Prophète ﷺ deux rak'ats avant le Dhohr, deux après, deux après le Maghrib et deux après l'Isha dans sa demeure. »", ar: "عن ابن عمر قال: «حفظت من النبي ﷺ عشر ركعات: ركعتين قبل الظهر، وركعتين بعدها، وركعتين بعد المغرب في بيته...»" }, auth: 'sahih' },
                { group_id: 'adoration', bab: 44, title: { fr: "Son jeûne", ar: "صومه ﷺ" }, content: { fr: "Jeûner les lundis, jeudis et jours blancs.", ar: "تحري صوم الاثنين والخميس." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ veillait particulièrement à jeûner les lundis et les jeudis de chaque semaine. »", ar: "عن عائشة قالت: «كان رسول الله ﷺ يتحرى صوم الاثنين والخميس»" }, auth: 'sahih' },
                { group_id: 'adoration', bab: 45, title: { fr: "Récitation du Coran", ar: "قراءته ﷺ" }, content: { fr: "Récitation lente, tirée et mélodieuse.", ar: "قراءة مدّاً ترتيلاً." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « La récitation du Coran par le Prophète ﷺ était allongée et mélodieuse. Il tirait bien sur les voyelles longues (Al-Madd). »", ar: "عن أنس بن مالك: «أنه سئل عن قراءة رسول الله ﷺ فقال: كانت مدّاً، ثم قرأ: بسم الله الرحمن الرحيم...»" }, auth: 'sahih' },
                { group_id: 'adoration', bab: 46, title: { fr: "Ses pleurs en prière", ar: "بكاؤه ﷺ" }, content: { fr: "Pleurs discrets (son de marmite en ébullition).", ar: "أزيز كأزيز المرجل من البكاء." }, dalil: { fr: "D'après Abdullâh ibn ash-Shikhkhîr (qu'Allah l'agrée) : « J'ai vu le Messager d'Allah ﷺ prier, et de sa poitrine s'échappait un son semblable au bouillonnement d'une marmite en ébullition tellement il pleurait par crainte d'Allah. »", ar: "عن عبد الله بن الشخير قال: «أتيت رسول الله ﷺ وهو يصلي ولجوفه أزيز كأزيز المرجل من البكاء»" }, auth: 'sahih' },
                { group_id: 'adoration', bab: 47, title: { fr: "Son lit modeste", ar: "فراشه ﷺ" }, content: { fr: "Matelas de cuir rembourré de fibres de palmier.", ar: "فراش من أدم حشوه ليف." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le matelas sur lequel dormait le Messager d'Allah ﷺ était fait d'un cuir souple rembourré de fibres de palmier. »", ar: "عن عائشة قالت: «إنما كان فراش رسول الله ﷺ الذي ينام عليه من أدم حشوه ليف»" }, auth: 'sahih' },

                /* Group: Caractere */
                { group_id: 'caractere', bab: 48, title: { fr: "Son humilité", ar: "تواضعه ﷺ" }, content: { fr: "Aider aux tâches et s'asseoir avec les pauvres.", ar: "يخدم أهله ويجلس مع المساكين." }, dalil: { fr: "D'après Anas (qu'Allah l'agrée) : « Le Prophète ﷺ montait un âne, réparait ses propres sandales, ravaudait ses vêtements et répondait à l'invitation du serviteur le plus humble. »", ar: "عن أنس قال: «كان النبي ﷺ يركب الحمار ويخصف النعل ويرقع الثوب ويجيب دعوة العبد»" }, auth: 'sahih' },
                { group_id: 'caractere', bab: 49, title: { fr: "Son noble caractère", ar: "خلقه ﷺ" }, content: { fr: "Ne rendait pas le mal par le mal, il pardonnait.", ar: "يعفو ويصفح ولا يجزي بالسيئة." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ n'était ni grossier ni vulgaire. Il ne criait pas dans les marchés et ne rendait pas le mal par le mal, mais il pardonnait et effaçait les fautes. »", ar: "عن عائشة قالت: «لم يكن رسول الله ﷺ فاحشاً ولا متفحشاً ولا صخاباً في الأسواق، ولا يجزي بالسيئة السيئة ولكن يعفو ويصفح»" }, auth: 'sahih' },
                { group_id: 'caractere', bab: 50, title: { fr: "Sa pudeur", ar: "حياؤه ﷺ" }, content: { fr: "Plus pudique qu'une jeune fille dans son giron.", ar: "أشد حياء من العذراء في خدرها." }, dalil: { fr: "D'après Abou Sa'îd al-Khudri (qu'Allah l'agrée) : « Le Prophète ﷺ était plus pudique qu'une jeune fille voilée dans son giron. Lorsqu'une chose lui déplaisait, nous le remarquions immédiatement sur son visage. »", ar: "عن أبي سعيد الخدري قال: «كان النبي ﷺ أشد حياء من العذراء في خدرها، فإذا كره شيئاً عرفناه في وجهه»" }, auth: 'sahih' },
                { group_id: 'caractere', bab: 51, title: { fr: "Sa Hijama (Ventouses)", ar: "حجامته ﷺ" }, content: { fr: "Pratiquer la Hijama pour la santé du corps.", ar: "احتجم وأعطى الحجام أجره." }, dalil: { fr: "D'après Ibn 'Abbâs (qu'Allah l'agrée) : « Le Prophète ﷺ s'est fait appliquer des ventouses (Hijama) sur la tête et a récompensé le praticien pour son travail. »", ar: "عن ابن عباس: «أن النبي ﷺ احتجم على رأسه وأعطى الحجام أجره»" }, auth: 'sahih' },

                /* Group: Fin */
                { group_id: 'fin', bab: 52, title: { fr: "Ses magnifiques noms", ar: "أسماؤه ﷺ" }, content: { fr: "Muhammad, Ahmad, Al-Mahi, Al-Hashir, Al-'Aqib.", ar: "لي أسماء: محمد، أحمد، الماحي..." }, dalil: { fr: "D'après Jubayr ibn Mut'im (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ a dit : 'J'ai plusieurs noms : Je suis Muhammad, je suis Ahmad, je suis Al-Mâhi (par qui Allah efface l'incrédulité), Al-Hâshir et Al-'Âqib'. »", ar: "عن جبير بن مطعم قال: قال رسول الله ﷺ: «إن لي أسماء: أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الله بي الكفر...»" }, auth: 'sahih' },
                { group_id: 'fin', bab: 53, title: { fr: "Son âge béni", ar: "عمره ﷺ" }, content: { fr: "Il a quitté ce monde à l'âge de 63 ans.", ar: "توفي وهو ابن ثلاث وستين سنة." }, dalil: { fr: "D'après Ibn 'Abbâs (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ est décédé à l'âge de soixante-trois ans (63 ans). »", ar: "عن ابن عباس قال: «توفي رسول الله ﷺ وهو ابن ثلاث وستين سنة»" }, auth: 'sahih' },
                { group_id: 'fin', bab: 54, title: { fr: "Son décès", ar: "وفاته ﷺ" }, content: { fr: "Son départ émouvant à Médine l'an 11 de l'Hégire.", ar: "وفاته الشريفة في ربيع الأول." }, dalil: { fr: "D'après Anas ibn Mâlik (qu'Allah l'agrée) : « Le jour où le Messager d'Allah ﷺ est entré à Médine, toute la ville s'est illuminée. Et le jour où il y est décédé, toute la ville s'est obscurcie de tristesse. »", ar: "عن أنس بن مالك قال: «لما كان اليوم الذي دخل فيه رسول الله ﷺ المدينة أضاء منها كل شيء، فلما كان اليوم الذي مات فيه أظلم منها كل شيء...»" }, auth: 'sahih' },
                { group_id: 'fin', bab: 55, title: { fr: "Son héritage", ar: "ميراثه ﷺ" }, content: { fr: "L'héritage des prophètes est la science et la guidée.", ar: "الأنبياء لم يورثوا ديناراً ولا درهماً." }, dalil: { fr: "D'après Aïcha (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ n'a laissé à sa mort ni dinar, ni dirham, ni mouton, ni chameau. Il n'a rien laissé en héritage materiel, son héritage est le savoir. »", ar: "عن عائشة قالت: «ما ترك رسول الله ﷺ ديناراً ولا درهماً ولا شاة ولا بعيراً ولا أوصى بشيء»" }, auth: 'sahih' },
                { group_id: 'fin', bab: 56, title: { fr: "La vision en rêve", ar: "رؤيته في المنام" }, content: { fr: "Celui qui le voit en rêve l'a réellement vu.", ar: "من رآني في المنام فقد رآني حقاً." }, dalil: { fr: "D'après Abou Hurayra (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ a dit : 'Celui qui me voit en rêve m'a réellement vu, car le Diable ne peut pas prendre mon apparence'. »", ar: "عن أبي هريرة قال: قال رسول الله ﷺ: «من رآني في المنام فقد رآني، فإن الشيطان لا يتمثل بي»" }, auth: 'sahih' }
            ],

            dictionary: [
                { word: "الممغط", type: "adjectif", def: { fr: "Le grand de taille, excessivement élancé.", ar: "الشديد الطول البائن." }, chapterKey: "apparence-1" },
                { word: "المتردد", type: "adjectif", def: { fr: "Celui dont les membres sont ramassés par une brièveté excessive.", ar: "المتناهي في القصر." }, chapterKey: "apparence-1" },
                { word: "غدة", type: "nom", def: { fr: "Petite excroissance de chair sous la peau (le Sceau).", ar: "قطعة لحم بارزة بين الكتفين." }, chapterKey: "apparence-2" },
                { word: "بالسبط", type: "adjectif", def: { fr: "Cheveux raides et complètement lisses.", ar: "المسترسل شديد النعومة." }, chapterKey: "apparence-3" },
                { word: "بالجعد القطط", type: "adjectif", def: { fr: "Cheveux très crépus ou très frisés.", ar: "شديد التلوي والالتواء." }, chapterKey: "apparence-3" },
                { word: "وَرِق", type: "nom", def: { fr: "Argent pur (métal précieux).", ar: "فضة الخالصة." }, chapterKey: "vetements-12" },
                { word: "تكفأ", type: "verbe", def: { fr: "S'avancer avec inclinaison et énergie comme en descente.", ar: "تمايل إلى الأمام بقوة وهيبة." }, chapterKey: "attitude-20" },
                { word: "القرفصاء", type: "nom", def: { fr: "Posture assise en entourant ses genoux avec ses bras par humilité.", ar: "جلسة المتواضعين ضم الركبتين بالذراعين." }, chapterKey: "attitude-22" },
                { word: "أزيز المرجل", type: "expression", def: { fr: "Le bouillonnement d'une marmite en ébullition (son des pleurs de crainte d'Allah).", ar: "صوت القدر تغلي من شدة الخشية." }, chapterKey: "adoration-46" },
                { word: "الماحي", type: "nom prophétique", def: { fr: "Celui par qui Allah efface l'incrédulité.", ar: "الذي يمحو الله به الكفر." }, chapterKey: "fin-52" }
            ],

            quiz: [
                { q: { fr: "Combien de chapitres compte l'ouvrage complet des Shamâ'il ?", ar: "كم باباً يحتوي كتاب الشمائل المحمدية؟" }, a: { fr: "Exactement 56 chapitres thématiques.", ar: "٥٦ باباً جامعاً لصفات النبي ﷺ." } },
                { q: { fr: "Quelle était la taille physique du Prophète ﷺ ?", ar: "كيف كانت قامة النبي ﷺ؟" }, a: { fr: "De taille moyenne (ni trop grand ni trop petit), avec de larges épaules.", ar: "مربوعاً (ليس بالطويل ولا بالقصير)، بعيد ما بين المنكبين." } },
                { q: { fr: "À quoi était comparée la lumière de son visage ?", ar: "بماذا شُبِّه ضياء وجهه ﷺ؟" }, a: { fr: "À la lumière douce de la pleine lune.", ar: "بالقمر ليلة البدر لجماله وضياء وجهه." } },
                { q: { fr: "À quoi ressemblait le Sceau de la Prophétie entre ses épaules ?", ar: "ما شكل خاتم النبوة بين كتفيه ﷺ؟" }, a: { fr: "À une petite excroissance de la taille d'un œuf de pigeon.", ar: "غدة حمراء مثل بيضة الحمامة." } },
                { q: { fr: "Quel était son vêtement préféré ?", ar: "ما هو أحب الثياب إلى رسول الله ﷺ؟" }, a: { fr: "Le Qamis (longue chemise propre et simple).", ar: "القميص" } }
            ]

        const totalChapters = appData.chapters.length;

        function getEl(id) { return document.getElementById(id); }

        function init() {
            applyTheme();
            applySettings();
            registerPWA();
            render();
            setupGlobalListeners();
        }

        function registerPWA() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            }
        }

        function setupGlobalListeners() {
            document.addEventListener('click', (e) => {
                const gharib = e.target.closest('.gharib-word');
                if (gharib) {
                    const wasActive = gharib.classList.contains('active');
                    document.querySelectorAll('.gharib-word').forEach(el => el.classList.remove('active'));
                    if (!wasActive) gharib.classList.add('active');
                } else {
                    document.querySelectorAll('.gharib-word').forEach(el => el.classList.remove('active'));
                }
            });
        }

        function zoomText(delta) {
            let currentScale = state.fontScale + delta;
            currentScale = Math.min(1.45, Math.max(0.75, currentScale));
            currentScale = Math.round(currentScale * 100) / 100;
            state.fontScale = currentScale;
            localStorage.setItem('shamail_arabic_scale', currentScale);
            document.documentElement.style.setProperty('--arabic-scale', currentScale);
            showToast(`Taille du texte : ${Math.round(currentScale * 100)}%`);
        }

        function applyTheme() {
            const html = document.documentElement;
            const body = document.body;
            
            html.classList.remove('dark');
            body.classList.remove('theme-sepia', 'theme-oled');

            if (state.theme === 'dark') {
                html.classList.add('dark');
            } else if (state.theme === 'sepia') {
                body.classList.add('theme-sepia');
            } else if (state.theme === 'oled') {
                html.classList.add('dark');
                body.classList.add('theme-oled');
            }

            const themeContainer = getEl('theme-icon-container');
            if (themeContainer) {
                let iconName = 'sun';
                if (state.theme === 'dark') iconName = 'moon';
                else if (state.theme === 'sepia') iconName = 'book-open';
                else if (state.theme === 'oled') iconName = 'sparkles';
                themeContainer.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i>`;
            }

            ['light', 'dark', 'sepia', 'oled'].forEach(mode => {
                const btn = getEl(`theme-btn-${mode}`);
                if (btn) {
                    if (state.theme === mode) {
                        btn.classList.add('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/40', 'text-madinah-600', 'dark:text-white');
                        btn.classList.remove('border-slate-200', 'dark:border-slate-700');
                    } else {
                        btn.classList.remove('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/40', 'text-madinah-600', 'dark:text-white');
                        btn.classList.add('border-slate-200', 'dark:border-slate-700');
                    }
                }
            });

            lucide.createIcons();
        }

        function cycleTheme() {
            const themes = ['light', 'dark', 'sepia', 'oled'];
            const nextIdx = (themes.indexOf(state.theme) + 1) % themes.length;
            setThemeMode(themes[nextIdx]);
        }

        function setThemeMode(mode) {
            state.theme = mode;
            localStorage.setItem('shamail_theme', mode);
            applyTheme();
        }

        function toggleSettings() {
            const modal = getEl('settings-modal');
            const content = getEl('settings-content');
            if (!modal || !content) return;

            if (modal.classList.contains('modal-closed')) {
                modal.classList.remove('modal-closed');
                modal.classList.add('modal-open');
                setTimeout(() => content.classList.remove('scale-95'), 10);
            } else {
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.remove('modal-open');
                    modal.classList.add('modal-closed');
                }, 180);
            }
        }

        function setFont(font) {
            state.settings.fontFamily = font;
            localStorage.setItem('shamail_fontFamily', font);
            applySettings();
            render();
        }

        function applySettings() {
            document.documentElement.style.setProperty('--arabic-scale', state.fontScale);

            ['Cairo', 'Amiri', 'Noto Naskh Arabic'].forEach(f => {
                const btnId = f === 'Noto Naskh Arabic' ? 'Noto' : f;
                const btn = getEl(`btn-font-${btnId}`);
                if (btn) {
                    if (f === state.settings.fontFamily) {
                        btn.classList.add('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/30');
                        btn.classList.remove('border-transparent', 'bg-slate-50', 'dark:bg-slate-700');
                    } else {
                        btn.classList.remove('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/30');
                        btn.classList.add('border-transparent', 'bg-slate-50', 'dark:bg-slate-700');
                    }
                }
            });
        }

        function toggleLang() {
            state.lang = state.lang === 'fr' ? 'ar' : 'fr';
            localStorage.setItem('shamail_lang', state.lang);
            render();
        }

        function setFilter(filter) {
            if (filter === 'dict') {
                setView('dictionary');
                return;
            }
            state.activeFilter = filter;
            renderDashboard();
        }

        function render() {
            const isRtl = state.lang === 'ar';
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            
            const langBtnSpan = document.querySelector('#lang-btn span');
            if (langBtnSpan) {
                langBtnSpan.innerText = state.lang === 'fr' ? 'عربي' : 'FR';
            }

            const headerLeft = getEl('header-left');
            if (headerLeft) {
                headerLeft.innerHTML = state.view !== 'dashboard' 
                    ? `<button onclick="setView('dashboard')" title="Retour" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200/60 dark:border-slate-700/60"><i data-lucide="${isRtl ? 'chevron-right' : 'chevron-left'}" class="w-5 h-5 text-slate-600 dark:text-slate-300"></i></button>`
                    : `<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-madinah-400 to-madinah-600 flex items-center justify-center shadow-sm"><i data-lucide="book-open" class="w-4 h-4 text-white"></i></div><span class="font-extrabold text-lg tracking-tight text-slate-800 dark:text-white font-arabicTitle">${appData.ui.title[state.lang]}</span>`;
            }

            if (state.view === 'dashboard') renderDashboard();
            else if (state.view === 'favorites') renderFavorites();
            else if (state.view === 'quiz') renderQuiz();
            else if (state.view === 'dictionary') renderDictionary();
            else renderGroup(state.activeGroupId);

            lucide.createIcons();
        }

        function handleSearch(e) {
            state.searchQuery = e.target.value.toLowerCase();
            updateSearchResults();
        }

        function updateSearchResults() {
            const isRtl = state.lang === 'ar';
            const container = getEl('dashboard-items-container');
            if (!container) return;

            let filteredChapters = appData.chapters;

            if (state.activeFilter === 'sharh') {
                filteredChapters = filteredChapters.filter(c => c.sharh);
            } else if (state.activeFilter === 'action') {
                filteredChapters = filteredChapters.filter(c => c.action);
            } else if (state.activeFilter === 'fav') {
                filteredChapters = filteredChapters.filter(c => state.favorites.includes(`${c.group_id}-${c.bab}`));
            }

            if (state.searchQuery.trim() !== '') {
                filteredChapters = filteredChapters.filter(c => 
                    c.title.fr.toLowerCase().includes(state.searchQuery) || 
                    c.title.ar.includes(state.searchQuery) ||
                    c.content.fr.toLowerCase().includes(state.searchQuery) ||
                    c.content.ar.includes(state.searchQuery) ||
                    c.dalil.fr.toLowerCase().includes(state.searchQuery) ||
                    c.dalil.ar.includes(state.searchQuery)
                );
            }

            if (state.searchQuery.trim() !== '' || state.activeFilter !== 'all') {
                if (filteredChapters.length > 0) {
                    let html = `<div class="space-y-4">`;
                    filteredChapters.forEach((chapter, index) => {
                        const group = appData.groups.find(g => g.id === chapter.group_id);
                        html += generateChapterCard(chapter, group, index, isRtl);
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<div class="text-center py-10 text-slate-400"><i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p class="font-medium text-sm">${appData.ui.noResults[state.lang]}</p></div>`;
                }
            } else {
                /* 8 THEME CARDS WITH PROGRESS COUNTERS */
                let html = `<div class="grid grid-cols-2 gap-3.5">`;
                appData.groups.forEach((group, idx) => {
                    const groupChapters = appData.chapters.filter(c => c.group_id === group.id);
                    const readCount = groupChapters.filter(c => state.readChapters.includes(`${c.group_id}-${c.bab}`)).length;
                    
                    html += `
                        <button onclick="setView('group', '${group.id}')" class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl p-4 rounded-2xl premium-shadow border border-slate-100 dark:border-slate-700/70 hover:-translate-y-0.5 active:scale-95 transition-all text-left flex flex-col justify-between h-full group relative overflow-hidden" style="animation-delay: ${idx * 30}ms; ${isRtl ? 'text-align: right;' : 'text-align: left;'}">
                            <div class="absolute inset-0 bg-gradient-to-br ${group.gradient} opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
                            
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${group.gradient} flex items-center justify-center shadow-md transform group-hover:scale-105 transition-transform duration-300">
                                        <i data-lucide="${group.icon}" class="w-5 h-5 text-white"></i>
                                    </div>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300">${readCount}/${groupChapters.length} Bâb</span>
                                </div>
                                <h3 class="font-bold text-sm text-slate-800 dark:text-white mb-0.5 font-arabic">${group.title[state.lang]}</h3>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight font-medium line-clamp-2">${group.desc[state.lang]}</p>
                            </div>

                            <div class="w-full bg-slate-100 dark:bg-slate-700 h-1 rounded-full overflow-hidden mt-3">
                                <div class="bg-madinah-500 h-full transition-all duration-500" style="width: ${groupChapters.length > 0 ? (readCount / groupChapters.length) * 100 : 0}%"></div>
                            </div>
                        </button>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            }
            lucide.createIcons();
        }

        function refreshDailySunnah() {
            state.dailySunnahIdx = (state.dailySunnahIdx + 1) % appData.chapters.length;
            renderDashboard();
        }

        function resumeLastBookmark() {
            if (!state.lastBookmark) return;
            const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === state.lastBookmark);
            if (chapter) setView('group', chapter.group_id);
        }

        function renderDashboard() {
            const isRtl = state.lang === 'ar';
            const progressPct = Math.min(100, Math.round((state.readChapters.length / totalChapters) * 100));
            const strokeDashoffset = 119 - (119 * progressPct / 100);

            const dailyChapter = appData.chapters[state.dailySunnahIdx];
            let bookmarkChapter = null;
            if (state.lastBookmark) {
                bookmarkChapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === state.lastBookmark);
            }

            let html = `
                <div class="animate-fade-in space-y-4 pb-4">
                    
                    <!-- ELEGANT HERO CARD -->
                    <div class="bg-gradient-to-br from-madinah-500/10 via-emerald-500/5 to-teal-500/10 dark:from-madinah-900/30 dark:to-slate-800/80 p-5 rounded-3xl border border-madinah-500/20 dark:border-slate-700/60 shadow-sm relative overflow-hidden">
                        
                        <!-- Calligraphic Salawat Banner -->
                        <div class="text-center py-2.5 px-4 bg-gradient-to-r from-emerald-500/10 via-madinah-500/20 to-emerald-500/10 dark:from-emerald-900/40 dark:via-madinah-900/50 dark:to-emerald-900/40 rounded-2xl border border-emerald-500/25 dark:border-emerald-700/50 mb-3.5 shadow-sm">
                            <span class="font-arabicTitle text-lg sm:text-xl font-bold text-emerald-800 dark:text-emerald-300 tracking-wide block leading-normal">
                                ﷺ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ وَسَلِّمْ
                            </span>
                        </div>

                        <div class="flex items-center justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                <h2 class="text-2xl font-extrabold text-slate-800 dark:text-white font-arabicTitle tracking-tight leading-tight">Shamâ'il</h2>
                                <p class="text-xs sm:text-sm text-madinah-600 dark:text-madinah-400 font-medium truncate">${appData.ui.subtitle[state.lang]} (56 Bâb)</p>
                            </div>

                            <!-- Circular Progress Ring (48px) -->
                            <div class="relative w-12 h-12 shrink-0 flex items-center justify-center">
                                <svg class="w-12 h-12 transform -rotate-90">
                                    <circle cx="24" cy="24" r="19" stroke="currentColor" stroke-width="3.5" class="text-slate-200/70 dark:text-slate-700" fill="transparent" />
                                    <circle cx="24" cy="24" r="19" stroke="currentColor" stroke-width="3.5" class="text-madinah-500 transition-all duration-1000" stroke-linecap="round" fill="transparent" stroke-dasharray="119" stroke-dashoffset="${strokeDashoffset}" />
                                </svg>
                                <span class="absolute text-xs font-black text-slate-700 dark:text-slate-200 font-mono">${progressPct}%</span>
                            </div>
                        </div>

                        ${bookmarkChapter ? `
                        <div class="mt-3 pt-3 border-t border-madinah-500/15 dark:border-slate-700/50 flex items-center justify-between">
                            <span class="text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center gap-1.5"><i data-lucide="bookmark" class="w-4 h-4 text-madinah-500"></i> Reprendre: <strong class="truncate max-w-[150px]">${bookmarkChapter.title[state.lang]}</strong></span>
                            <button onclick="resumeLastBookmark()" class="px-3 py-1 rounded-xl bg-madinah-600 text-white text-xs font-bold shadow-sm active:scale-95 transition-all">Continuer</button>
                        </div>
                        ` : ''}

                        <!-- Quick Action Row -->
                        <div class="flex gap-2 mt-3.5 pt-3 border-t border-madinah-500/15 dark:border-slate-700/50">
                            <button onclick="setView('quiz')" class="flex-1 py-2 px-3 rounded-xl bg-violet-100/80 dark:bg-violet-900/40 text-violet-700 dark:text-violet-300 text-xs font-bold flex items-center justify-center gap-1.5 hover:scale-[1.02] active:scale-95 transition-all">
                                <i data-lucide="brain" class="w-4 h-4"></i> Quiz
                            </button>
                            <button onclick="setView('dictionary')" class="flex-1 py-2 px-3 rounded-xl bg-emerald-100/80 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 text-xs font-bold flex items-center justify-center gap-1.5 hover:scale-[1.02] active:scale-95 transition-all">
                                <i data-lucide="book-marked" class="w-4 h-4"></i> Dico
                            </button>
                            <button onclick="setView('favorites')" class="flex-1 py-2 px-3 rounded-xl bg-rose-100/80 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300 text-xs font-bold flex items-center justify-center gap-1.5 hover:scale-[1.02] active:scale-95 transition-all">
                                <i data-lucide="heart" class="w-4 h-4 fill-current"></i> Favoris (${state.favorites.length})
                            </button>
                        </div>
                    </div>

                    <!-- SUNNAH DU JOUR CARD -->
                    <div class="bg-amber-50/90 dark:bg-amber-950/30 p-4 rounded-2xl border border-amber-200/70 dark:border-amber-800/40 shadow-sm relative">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-amber-700 dark:text-amber-400 flex items-center gap-1.5"><i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i> Sunnah du Jour</span>
                            <button onclick="refreshDailySunnah()" title="Changer de Sunnah" class="text-amber-600 dark:text-amber-400 p-1 hover:bg-amber-100 dark:hover:bg-amber-900/50 rounded-lg transition-colors text-xs font-bold flex items-center gap-1">
                                🎲 Autre
                            </button>
                        </div>
                        <h4 class="font-bold text-sm text-slate-800 dark:text-white mb-1 font-arabicTitle">${dailyChapter.title[state.lang]}</h4>
                        <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed mb-2">${dailyChapter.content[state.lang]}</p>
                        <button onclick="setView('group', '${dailyChapter.group_id}')" class="text-xs font-bold text-amber-700 dark:text-amber-400 hover:underline flex items-center gap-1">Lire le chapitre complet <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button>
                    </div>

                    <!-- SEARCH & FILTER ROW -->
                    <div class="space-y-2">
                        <div class="relative">
                            <i data-lucide="search" class="absolute ${isRtl ? 'right-3.5' : 'left-3.5'} top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input id="search-input" type="text" oninput="handleSearch(event)" value="${state.searchQuery}" placeholder="${appData.ui.searchPlaceholder[state.lang]}" class="w-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border border-slate-200/80 dark:border-slate-700/80 rounded-2xl py-2.5 ${isRtl ? 'pr-10 pl-3' : 'pl-10 pr-3'} text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-madinah-500 transition-all font-medium placeholder-slate-400 shadow-sm">
                        </div>

                        <!-- Compact Filter Pills Menu -->
                        <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                            <button onclick="setFilter('all')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 ${state.activeFilter === 'all' ? 'bg-madinah-600 text-white shadow-sm' : 'bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/60'}">Tous</button>
                            <button onclick="setFilter('sharh')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 ${state.activeFilter === 'sharh' ? 'bg-madinah-600 text-white shadow-sm' : 'bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/60'}">💡 Sharh</button>
                            <button onclick="setFilter('action')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 ${state.activeFilter === 'action' ? 'bg-madinah-600 text-white shadow-sm' : 'bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/60'}">⚡ Sunnah</button>
                            <button onclick="setFilter('fav')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 ${state.activeFilter === 'fav' ? 'bg-madinah-600 text-white shadow-sm' : 'bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/60'}">❤️ Favoris</button>
                            <button onclick="setFilter('dict')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/60">📖 Dico Gharib</button>
                        </div>
                    </div>

                    <div id="dashboard-items-container"></div>
                </div>
            `;

            getEl('app-content').innerHTML = html;
            updateSearchResults();
        }

        function renderGroup(groupId) {
            const group = appData.groups.find(g => g.id === groupId);
            const chapters = appData.chapters.filter(c => c.group_id === groupId);
            const isRtl = state.lang === 'ar';

            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="text-center mb-6 pt-1">
                        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br ${group.gradient} flex items-center justify-center shadow-xl mb-3 transform rotate-2 ring-4 ring-white/50 dark:ring-slate-800/50">
                            <i data-lucide="${group.icon}" class="w-8 h-8 text-white"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white font-arabicTitle mb-1">${group.title[state.lang]}</h2>
                        <p class="text-slate-500 dark:text-slate-400 font-medium text-xs mb-2">${group.desc[state.lang]}</p>
                        <span class="inline-block px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">${chapters.length} Chapitres inclus</span>
                    </div>
                    <div class="space-y-4">
            `;
            
            chapters.forEach((chapter, index) => {
                html += generateChapterCard(chapter, group, index, isRtl);
            });

            html += `</div></div>`;
            getEl('app-content').innerHTML = html;
        }

        function generateChapterCard(chapter, group, index, isRtl) {
            const chapterKey = `${group.id}-${chapter.bab}`;
            const isFav = state.favorites.includes(chapterKey);
            const isRead = state.readChapters.includes(chapterKey);
            
            let authBadge = '';
            if (chapter.auth === 'sahih') {
                authBadge = `<span class="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400 text-xs font-bold border border-emerald-200 dark:border-emerald-800/50 flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>صحيح Sahih</span>`;
            } else if (chapter.auth === 'hasan') {
                authBadge = `<span class="px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-400 text-xs font-bold border border-amber-200 dark:border-amber-800/50 flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>حسن Hasan</span>`;
            }

            const fontClass = state.settings.fontFamily === 'Amiri' ? 'font-arabicTitle' : (state.settings.fontFamily === 'Noto Naskh Arabic' ? 'font-arabicNaskh' : 'font-arabic');

            return `
                <div onclick="saveBookmark('${chapterKey}')" class="group bg-white/90 dark:bg-slate-800/95 backdrop-blur-2xl p-6 rounded-3xl premium-shadow border border-white/80 dark:border-slate-700 transition-all duration-300 flex flex-col gap-4 animate-slide-up relative overflow-hidden ${isRead ? 'opacity-85' : ''} hover:-translate-y-0.5 hover:shadow-xl" style="animation-delay: ${index * 30}ms; animation-fill-mode: both;">
                    <div class="card-spine bg-gradient-to-b ${group.gradient}"></div>
                    
                    <div class="flex items-start justify-between pl-2">
                        <div>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 tracking-wider uppercase mb-0.5 flex items-center gap-1"><i data-lucide="door-open" class="w-3.5 h-3.5"></i> Bâb ${chapter.bab}</span>
                            <h3 class="font-scaled-title font-bold text-slate-800 dark:text-white ${isRtl ? fontClass : ''}">${chapter.title[state.lang]}</h3>
                        </div>
                    </div>
                    
                    <p class="font-scaled-body text-slate-600 dark:text-slate-300 pl-2 ${isRtl ? fontClass : ''}">${chapter.content[state.lang]}</p>

                    <div class="relative bg-gradient-to-br from-slate-50 to-slate-100/50 dark:from-slate-900/80 dark:to-slate-900/40 p-4.5 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 shadow-inner">

                        <div class="flex items-center justify-between mb-2 relative z-10">
                            <div class="flex items-center gap-1.5">
                                <div class="bg-madinah-100 dark:bg-madinah-900/30 p-1 rounded-md border border-madinah-200 dark:border-madinah-800/50">

                                </div>
                                <span class="text-xs font-black uppercase tracking-widest text-madinah-600 dark:text-madinah-400">
