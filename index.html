    <style>
        /* Base Styles & Typography Scale */
        :root {
            --arabic-scale: 1.05;
        }

        html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        body { margin: 0; padding: 0; }
        
        /* Proportional Font Scaling Utilities */
        .font-scaled-title { font-size: calc(1.35rem * var(--arabic-scale)); line-height: 1.4; }
        .font-scaled-body { font-size: calc(1.05rem * var(--arabic-scale)); line-height: 1.7; }
        .font-scaled-dalil { font-size: calc(0.95rem * var(--arabic-scale)); line-height: 1.7; }
        .font-scaled-sharh { font-size: calc(0.9rem * var(--arabic-scale)); line-height: 1.7; }
        
        /* Hide Scrollbars everywhere for compact horizontal menus */
        .no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Scrollbar for Main App */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Background Arabesque Pattern */
        .bg-arabesque {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2310b981' fill-opacity='0.03'%3E%3Cpath d='M30 30L15 0H0v15l30 30L0 45v15h15l30-30 15 30h15V45L30 30zM30 30l15 30h15V45L30 15 45 0H30L15 30l15 15z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .dark .bg-arabesque {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2334d399' fill-opacity='0.02'%3E%3Cpath d='M30 30L15 0H0v15l30 30L0 45v15h15l30-30 15 30h15V45L30 30zM30 30l15 30h15V45L30 15 45 0H30L15 30l15 15z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* Premium UI Elements */
        .glass-panel { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.9); }
        
        .premium-shadow { box-shadow: 0 6px 25px -5px rgba(0,0,0,0.07); }
        .dark .premium-shadow { box-shadow: 0 6px 25px -5px rgba(0,0,0,0.35); }

        .card-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; opacity: 0.9; }

        /* Accordion Sharh */
        .sharh-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0, 1, 0, 1), opacity 0.3s ease-out;
            opacity: 0;
        }
        .sharh-content.open { 
            max-height: 1000px;
            opacity: 1; 
            transition: max-height 0.5s ease-in-out, opacity 0.4s ease-in;
        }

        /* Quiz Flip Card */
        .perspective-1000 { perspective: 1000px; -webkit-perspective: 1000px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
        .flip-card-inner.flipped { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 1.75rem; }
        .flip-card-back { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }

        /* Dictionnaire Gharib & Tooltips */
        .gharib-word { 
            position: relative; 
            display: inline-block; 
            border-bottom: 2px dashed #10b981; 
            cursor: pointer; 
            transition: all 0.2s;
            padding: 0 2px;
        }
        .gharib-word:hover, .gharib-word:focus { color: #10b981; background-color: rgba(16, 185, 129, 0.1); border-radius: 4px; }
        
        .tooltip {
            visibility: hidden;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 7px 11px;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            font-size: 0.85rem;
            line-height: 1.35;
            width: max-content;
            max-width: 220px;
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }
        .gharib-word:hover .tooltip, .gharib-word.active .tooltip { visibility: visible; opacity: 1; }
        .dark .gharib-word .tooltip { background-color: #334155; }
        .dark .gharib-word .tooltip::after { border-color: #334155 transparent transparent transparent; }

        /* Menu Settings Modal */
        #settings-modal, #card-modal {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.2s ease-out;
        }
        .modal-open { opacity: 1; pointer-events: auto; }
        .modal-closed { opacity: 0; pointer-events: none; }
        
        /* Sepia Theme */
        body.theme-sepia { background-color: #fbf8f3 !important; color: #43302b !important; }
        body.theme-sepia .glass-panel { background: rgba(251, 248, 243, 0.92) !important; border-color: rgba(215, 195, 168, 0.5); }
        body.theme-sepia .bg-white\/90, body.theme-sepia .bg-white\/80, body.theme-sepia .bg-white\/40 { background-color: rgba(245, 239, 230, 0.95) !important; }
        body.theme-sepia .text-slate-800 { color: #36241e !important; }
        body.theme-sepia .text-slate-700 { color: #4a372f !important; }
        body.theme-sepia .text-slate-600, body.theme-sepia .text-slate-500 { color: #6a5246 !important; }
        body.theme-sepia .bg-slate-50, body.theme-sepia .bg-slate-100 { background-color: #f1e6d6 !important; }
        body.theme-sepia .border-slate-100, body.theme-sepia .border-slate-200 { border-color: #e3d5c3 !important; }

        /* OLED Mode */
        body.theme-oled { background-color: #000000 !important; color: #e2e8f0; }
        body.theme-oled .glass-panel { background: rgba(0, 0, 0, 0.92) !important; border-color: rgba(255,255,255,0.08); }
        body.theme-oled .bg-white\/90, body.theme-oled .bg-white\/80, body.theme-oled .bg-white\/30 { background-color: rgba(12, 12, 12, 0.95) !important; }
        body.theme-oled .dark\:bg-slate-800, body.theme-oled .dark\:bg-slate-900 { background-color: #050505 !important; }
        body.theme-oled .dark\:bg-slate-800\/90, body.theme-oled .dark\:bg-slate-800\/95 { background-color: #080808 !important; }
        body.theme-oled .dark\:border-slate-700 { border-color: #1f2937 !important; }
    </style>
</head>

                { q: { fr: "De quel pain se nourrissait principalement sa famille ?", ar: "ما هو غالب خبز آل محمد ﷺ؟" }, a: { fr: "Du pain d'orge (خبز الشعير).", ar: "خبز الشعير." } },
                { q: { fr: "En combien de gorgées buvait-il un verre d'eau ?", ar: "على كم دفعة كان يشرب الماء ﷺ؟" }, a: { fr: "En trois gorgées en éloignant le verre pour respirer.", ar: "على ثلاث دفعات ويبعد الإناء عن فمه." } },

                { q: { fr: "Quelle était son attitude face au parfum offered ?", ar: "ما كان موقف النبي ﷺ إذا أُهدي إليه طيب؟" }, a: { fr: "Il aimait le parfum et ne le refusait jamais.", ar: "كان يحب الطيب ولا يرده." } },
                { q: { fr: "Sur quel côté s'allongeait-il pour dormir ?", ar: "على أي شق كان ينام النبي ﷺ؟" }, a: { fr: "Sur le côté droit, la main droite sous la joue.", ar: "على شقه الأيمن واضعاً يده تحت خده الأيمن." } },
                { q: { fr: "À quoi ressemblait le son de ses pleurs en prière ?", ar: "بماذا شُبِّه صوت بكائه ﷺ في الصلاة؟" }, a: { fr: "Au bouillonnement d'une marmite (أزيز المرجل) dans sa poitrine.", ar: "كأزيز المرجل (القدر تغلي) من شدة الخشية." } },
                { q: { fr: "Que signifie son nom 'Al-Mahi' (الماحي) ?", ar: "ما معنى اسم 'الماحي' من أسماء النبي ﷺ؟" }, a: { fr: "Celui par qui Allah efface l'incrédulité.", ar: "الذي يمحو الله به الكفر." } },
                { q: { fr: "Qu'a laissé le Prophète ﷺ en héritage à sa mort ?", ar: "ماذا ترك النبي ﷺ عند وفاته؟" }, a: { fr: "Ni dinar ni dirham, mais le savoir et la guidée.", ar: "لم يترك ديناراً ولا درهماً، بل ترك العلم والهدى." } }

        };

        const state = {
            lang: localStorage.getItem('shamail_lang') || 'fr',
            theme: localStorage.getItem('shamail_theme') || 'light',
            view: 'dashboard', 
            activeGroupId: null,
            favorites: JSON.parse(localStorage.getItem('shamail_favorites')) || [],
            readChapters: JSON.parse(localStorage.getItem('shamail_read')) || [],
            lastBookmark: localStorage.getItem('shamail_last_bookmark') || null,
            dailySunnahIdx: Math.floor(Math.random() * appData.chapters.length),
            searchQuery: '',
            dictQuery: '',
            activeFilter: 'all',
            quizIndex: 0,
            quizScore: 0,
            quizFlipped: false,
            quizFinished: false,
            fontScale: parseFloat(localStorage.getItem('shamail_arabic_scale')) || 1.05,
            currentGeneratedImageData: null,
            settings: {
                fontFamily: localStorage.getItem('shamail_fontFamily') || 'Cairo'
            }
        };

        const totalChapters = 56;

        function getEl(id) { return document.getElementById(id); }

        function init() {
            applyTheme();
            applySettings();
            registerPWA();
            render();
            setupGlobalListeners();
        }

        function registerPWA() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            }
        }

        function setupGlobalListeners() {
            document.addEventListener('click', (e) => {
                const gharib = e.target.closest('.gharib-word');
                if (gharib) {
                    const wasActive = gharib.classList.contains('active');
                    document.querySelectorAll('.gharib-word').forEach(el => el.classList.remove('active'));
                    if (!wasActive) gharib.classList.add('active');
                } else {
                    document.querySelectorAll('.gharib-word').forEach(el => el.classList.remove('active'));
                }
            });
        }

        function zoomText(delta) {
            let currentScale = state.fontScale + delta;
            currentScale = Math.min(1.45, Math.max(0.75, currentScale));
            currentScale = Math.round(currentScale * 100) / 100;
            state.fontScale = currentScale;
            localStorage.setItem('shamail_arabic_scale', currentScale);
            document.documentElement.style.setProperty('--arabic-scale', currentScale);
            showToast(`Taille du texte : ${Math.round(currentScale * 100)}%`);
        }

        function applyTheme() {
            const html = document.documentElement;
            const body = document.body;
            
            html.classList.remove('dark');
            body.classList.remove('theme-sepia', 'theme-oled');

            if (state.theme === 'dark') {
                html.classList.add('dark');
            } else if (state.theme === 'sepia') {
                body.classList.add('theme-sepia');
            } else if (state.theme === 'oled') {
                html.classList.add('dark');
                body.classList.add('theme-oled');
            }

            const themeContainer = getEl('theme-icon-container');
            if (themeContainer) {
                let iconName = 'sun';
                if (state.theme === 'dark') iconName = 'moon';
                else if (state.theme === 'sepia') iconName = 'book-open';
                else if (state.theme === 'oled') iconName = 'sparkles';
                themeContainer.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i>`;
            }

            ['light', 'dark', 'sepia', 'oled'].forEach(mode => {
                const btn = getEl(`theme-btn-${mode}`);
                if (btn) {
                    if (state.theme === mode) {
                        btn.classList.add('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/40', 'text-madinah-600', 'dark:text-white');
                        btn.classList.remove('border-slate-200', 'dark:border-slate-700');
                    } else {
                        btn.classList.remove('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/40', 'text-madinah-600', 'dark:text-white');
                        btn.classList.add('border-slate-200', 'dark:border-slate-700');
                    }
                }
            });

            lucide.createIcons();
        }

        function cycleTheme() {
            const themes = ['light', 'dark', 'sepia', 'oled'];
            const nextIdx = (themes.indexOf(state.theme) + 1) % themes.length;
            setThemeMode(themes[nextIdx]);
        }

        function setThemeMode(mode) {
            state.theme = mode;
            localStorage.setItem('shamail_theme', mode);
            applyTheme();
        }

        function toggleSettings() {
            const modal = getEl('settings-modal');
            const content = getEl('settings-content');
            if (!modal || !content) return;

            if (modal.classList.contains('modal-closed')) {
                modal.classList.remove('modal-closed');
                modal.classList.add('modal-open');
                setTimeout(() => content.classList.remove('scale-95'), 10);
            } else {
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.remove('modal-open');
                    modal.classList.add('modal-closed');
                }, 180);
            }
        }

        function setFont(font) {
            state.settings.fontFamily = font;
            localStorage.setItem('shamail_fontFamily', font);
            applySettings();
            render();
        }

        function applySettings() {
            document.documentElement.style.setProperty('--arabic-scale', state.fontScale);

            ['Cairo', 'Amiri', 'Noto Naskh Arabic'].forEach(f => {
                const btnId = f === 'Noto Naskh Arabic' ? 'Noto' : f;
                const btn = getEl(`btn-font-${btnId}`);
                if (btn) {
                    if (f === state.settings.fontFamily) {
                        btn.classList.add('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/30');
                        btn.classList.remove('border-transparent', 'bg-slate-50', 'dark:bg-slate-700');
                    } else {
                        btn.classList.remove('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/30');
                        btn.classList.add('border-transparent', 'bg-slate-50', 'dark:bg-slate-700');
                    }
                }
            });
        }

        function toggleLang() {
            state.lang = state.lang === 'fr' ? 'ar' : 'fr';
            localStorage.setItem('shamail_lang', state.lang);
            render();
        }

        function setFilter(filter) {
            if (filter === 'dict') {
                setView('dictionary');
                return;
            }
            state.activeFilter = filter;
            renderDashboard();
        }

        function render() {
            const isRtl = state.lang === 'ar';
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            
            const langBtnSpan = document.querySelector('#lang-btn span');
            if (langBtnSpan) {
                langBtnSpan.innerText = state.lang === 'fr' ? 'عربي' : 'FR';
            }

            const headerLeft = getEl('header-left');
            if (headerLeft) {
                headerLeft.innerHTML = state.view !== 'dashboard' 
                    ? `<button onclick="setView('dashboard')" title="Retour" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200/60 dark:border-slate-700/60"><i data-lucide="${isRtl ? 'chevron-right' : 'chevron-left'}" class="w-5 h-5 text-slate-600 dark:text-slate-300"></i></button>`
                    : `<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-madinah-400 to-madinah-600 flex items-center justify-center shadow-sm"><i data-lucide="book-open" class="w-4 h-4 text-white"></i></div><span class="font-extrabold text-lg tracking-tight text-slate-800 dark:text-white font-arabicTitle">${appData.ui.title[state.lang]}</span>`;
            }

            if (state.view === 'dashboard') renderDashboard();
            else if (state.view === 'favorites') renderFavorites();
            else if (state.view === 'quiz') renderQuiz();
            else if (state.view === 'dictionary') renderDictionary();
            else renderGroup(state.activeGroupId);

            lucide.createIcons();
        }

        function handleSearch(e) {
            state.searchQuery = e.target.value.toLowerCase();
            updateSearchResults();
        }

        function updateSearchResults() {
            const isRtl = state.lang === 'ar';
            const container = getEl('dashboard-items-container');
            if (!container) return;

            let filteredChapters = appData.chapters;

            if (state.activeFilter === 'sharh') {
                filteredChapters = filteredChapters.filter(c => c.sharh);
            } else if (state.activeFilter === 'action') {
                filteredChapters = filteredChapters.filter(c => c.action);
            } else if (state.activeFilter === 'fav') {
                filteredChapters = filteredChapters.filter(c => state.favorites.includes(`${c.group_id}-${c.bab}`));
            }

            if (state.searchQuery.trim() !== '') {
                filteredChapters = filteredChapters.filter(c => 
                    c.title.fr.toLowerCase().includes(state.searchQuery) || 
                    c.title.ar.includes(state.searchQuery) ||
                    c.content.fr.toLowerCase().includes(state.searchQuery) ||
                    c.content.ar.includes(state.searchQuery)
                );
            }

            if (state.searchQuery.trim() !== '' || state.activeFilter !== 'all') {
                if (filteredChapters.length > 0) {
                    let html = `<div class="space-y-4">`;
                    filteredChapters.forEach((chapter, index) => {
                        const group = appData.groups.find(g => g.id === chapter.group_id);
                        html += generateChapterCard(chapter, group, index, isRtl);
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<div class="text-center py-10 text-slate-400"><i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p class="font-medium text-sm">${appData.ui.noResults[state.lang]}</p></div>`;
                }
            } else {
                let html = `<div class="grid grid-cols-2 gap-3.5">`;
                appData.groups.forEach((group, idx) => {
                    html += `
                        <button onclick="setView('group', '${group.id}')" class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl p-4 rounded-2xl premium-shadow border border-slate-100 dark:border-slate-700/70 hover:-translate-y-0.5 active:scale-95 transition-all text-left flex flex-col h-full group relative overflow-hidden" style="animation-delay: ${idx * 30}ms; ${isRtl ? 'text-align: right;' : 'text-align: left;'}">
                            <div class="absolute inset-0 bg-gradient-to-br ${group.gradient} opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
                            <div class="w-11 h-11 rounded-xl bg-gradient-to-br ${group.gradient} flex items-center justify-center shadow-md mb-3 transform group-hover:scale-105 transition-transform duration-300">
                                <i data-lucide="${group.icon}" class="w-5 h-5 text-white"></i>
                            </div>
                            <h3 class="font-bold text-base text-slate-800 dark:text-white mb-0.5 font-arabic">${group.title[state.lang]}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 leading-snug font-medium line-clamp-2">${group.desc[state.lang]}</p>
                        </button>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            }
            lucide.createIcons();
        }

        function refreshDailySunnah() {
            state.dailySunnahIdx = (state.dailySunnahIdx + 1) % appData.chapters.length;
            renderDashboard();
        }

        function resumeLastBookmark() {
            if (!state.lastBookmark) return;
            const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === state.lastBookmark);
            if (chapter) setView('group', chapter.group_id);
        }

        function renderDashboard() {
            const isRtl = state.lang === 'ar';
            const progressPct = Math.min(100, Math.round((state.readChapters.length / totalChapters) * 100));
            const strokeDashoffset = 119 - (119 * progressPct / 100);

            const dailyChapter = appData.chapters[state.dailySunnahIdx];
            let bookmarkChapter = null;
            if (state.lastBookmark) {
                bookmarkChapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === state.lastBookmark);
            }

            let html = `
                <div class="animate-fade-in space-y-4 pb-4">
                    
                    <!-- ELEGANT HERO CARD -->

        /* HTML5 Canvas Hadith Image Generator */
        function generateHadithCard(chapterKey, e) {
            if (e) e.stopPropagation();
            const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === chapterKey);
            if (!chapter) return;

            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');

            // Background Gradient
            const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
            grad.addColorStop(0, '#064e3b');
            grad.addColorStop(1, '#022c22');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Inner Gold Border
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 10;
            ctx.strokeRect(40, 40, 1000, 1000);

            // Calligraphy Salawat Header
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 44px Amiri, serif';
            ctx.textAlign = 'center';
            ctx.fillText('ﷺ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ وَسَلِّمْ', 540, 130);

            // Chapter Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Amiri, serif';
            ctx.fillText(chapter.title.fr, 540, 220);

            // Hadith Content (Word wrapped)
            ctx.fillStyle = '#ecfdf5';
            ctx.font = '34px Cairo, sans-serif';
            wrapCanvasText(ctx, chapter.content.fr, 540, 330, 900, 50);

            // Hadith Dalil Quote
            let dalilClean = chapter.dalil.fr.replace(/<[^>]*>?/gm, '');
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'italic 28px Inter, sans-serif';
            wrapCanvasText(ctx, dalilClean, 540, 680, 880, 42);

            // Footer Branding
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 26px Inter, sans-serif';
            ctx.fillText("— Shamâ'il Muhammadiyya", 540, 980);

            const dataUrl = canvas.toDataURL('image/png');
            state.currentGeneratedImageData = dataUrl;

            const modalImg = getEl('card-preview-img');
            const downloadBtn = getEl('card-download-btn');
            if (modalImg) modalImg.src = dataUrl;
            if (downloadBtn) downloadBtn.href = dataUrl;

            openCardModal();
        }

        function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line.trim(), x, currentY);
        }

        function openCardModal() {
            const modal = getEl('card-modal');
            const content = getEl('card-modal-content');
            if (!modal || !content) return;
            modal.classList.remove('modal-closed');
            modal.classList.add('modal-open');
            setTimeout(() => content.classList.remove('scale-95'), 10);
        }

        function closeCardModal() {
            const modal = getEl('card-modal');
            const content = getEl('card-modal-content');
            if (!modal || !content) return;
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('modal-open');
                modal.classList.add('modal-closed');
            }, 180);
        }

        function shareCardImage() {
            if (navigator.share && state.currentGeneratedImageData) {
                fetch(state.currentGeneratedImageData)
                    .then(res => res.blob())
                    .then(blob => {
                        const file = new File([blob], 'hadith-shamail.png', { type: 'image/png' });
                        navigator.share({
                            title: "Hadith Shamâ'il",
                            files: [file]
                        }).catch(() => showToast("Image téléchargée !"));
                    });
            } else {
                showToast("Téléchargement de l'image...");
            }
        }

        function toggleSharh(chapterKey, e) {
            if (e) e.stopPropagation();
            const content = getEl(`sharh-${chapterKey}`);
            const icon = getEl(`sharh-icon-${chapterKey}`);
            if (!content || !icon) return;

            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function toggleFavorite(chapterKey, e) {
            if (e) e.stopPropagation();
            const idx = state.favorites.indexOf(chapterKey);
            if (idx > -1) {
                state.favorites.splice(idx, 1);
                showToast(appData.ui.removed[state.lang]);
            } else {
                state.favorites.push(chapterKey);
                showToast(appData.ui.saved[state.lang]);
            }
            localStorage.setItem('shamail_favorites', JSON.stringify(state.favorites));
            render();
        }

        function toggleRead(chapterKey, e) {
            if (e) e.stopPropagation();
            const idx = state.readChapters.indexOf(chapterKey);
            if (idx > -1) {
                state.readChapters.splice(idx, 1);
            } else {
                state.readChapters.push(chapterKey);
            }
            localStorage.setItem('shamail_read', JSON.stringify(state.readChapters));
            render();
        }

        function shareChapter(chapterKey, e) {
            if (e) e.stopPropagation();
            const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === chapterKey);
            if (!chapter) return;

            let dalilClean = chapter.dalil[state.lang].replace(/<[^>]*>?/gm, '');
            const text = `✨ ${chapter.title[state.lang]}\n\n📖 ${chapter.content[state.lang]}\n\n📜 ${appData.ui.proof[state.lang]}: ${dalilClean}\n\n— Shamâ'il App`;
            
            if (navigator.share) {
                navigator.share({ title: chapter.title[state.lang], text: text }).catch(() => {
                    copyToClipboard(text);
                });
            } else {
                copyToClipboard(text);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(appData.ui.copied[state.lang]);
            }).catch(() => {
                showToast(appData.ui.copied[state.lang]);
            });
        }

        function renderFavorites() {
            const isRtl = state.lang === 'ar';
            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="text-center mb-6 pt-2">
                        <div class="w-14 h-14 mx-auto rounded-full bg-rose-100 dark:bg-rose-900/50 flex items-center justify-center mb-3 text-rose-500">
                            <i data-lucide="heart" class="w-7 h-7 fill-current"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white font-arabicTitle">${appData.ui.favorites[state.lang]}</h2>
                    </div>
                    <div class="space-y-4">
            `;
            
            if (state.favorites.length === 0) {
                html += `<div class="text-center py-10 text-slate-400"><i data-lucide="heart-off" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p class="font-medium text-xs">${appData.ui.noFavorites[state.lang]}</p></div>`;
            } else {
                state.favorites.forEach((key, index) => {
                    const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === key);
                    if (chapter) {
                        const group = appData.groups.find(g => g.id === chapter.group_id);
                        html += generateChapterCard(chapter, group, index, isRtl);
                    }
                });
            }
            html += `</div></div>`;
            getEl('app-content').innerHTML = html;
        }

        function renderQuiz() {
            const isRtl = state.lang === 'ar';
            
            if (state.quizFinished) {
                let celebrateMsg = "Excellent travail ! Vous maîtrisez les Shamâ'il prophétiques.";
                if (state.quizScore < 12) celebrateMsg = "Bon effort ! Continuez votre lecture pour enrichir vos connaissances.";

                let html = `
                    <div class="animate-fade-in flex flex-col items-center justify-center min-h-[65vh] py-4 text-center">
                        <div class="w-20 h-20 rounded-full bg-gradient-to-br from-violet-400 to-fuchsia-600 flex items-center justify-center text-white shadow-xl mb-4 animate-bounce-short">
                            <i data-lucide="trophy" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white font-arabicTitle mb-1">Quiz Terminé !</h2>
                        <p class="text-slate-500 dark:text-slate-400 font-medium text-xs mb-5 max-w-xs">${celebrateMsg}</p>
                        
                        <div class="bg-white/90 dark:bg-slate-800/90 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-lg mb-6 w-full max-w-xs">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Votre Score Final</span>
                            <span class="text-3xl font-black text-violet-600 dark:text-violet-400 font-mono">${state.quizScore} / ${appData.quiz.length}</span>
                        </div>

                        <button onclick="resetQuiz()" class="px-7 py-3 rounded-full bg-gradient-to-r from-violet-500 to-fuchsia-600 text-white font-bold text-xs hover:scale-105 active:scale-95 transition-all shadow-lg flex items-center gap-2">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Recommencer le Quiz
                        </button>
                    </div>
                `;
                getEl('app-content').innerHTML = html;
                lucide.createIcons();
                return;
            }

            const quizItem = appData.quiz[state.quizIndex];
            state.quizFlipped = false;

            let html = `
                <div class="animate-fade-in flex flex-col items-center justify-center min-h-[65vh] py-3">
                    <div class="text-center mb-5">
                        <h2 class="text-xl font-black text-slate-800 dark:text-white mb-0.5 flex items-center justify-center gap-1.5 font-arabicTitle"><i data-lucide="brain" class="w-5 h-5 text-violet-500"></i> ${appData.ui.quizTitle[state.lang]}</h2>
                        <div class="flex items-center justify-center gap-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                            <span>Question ${state.quizIndex + 1} / ${appData.quiz.length}</span>
                            <span>•</span>
                            <span class="text-emerald-600 dark:text-emerald-400">Score: ${state.quizScore}</span>
                        </div>
                    </div>
                    
                    <div class="w-full max-w-sm h-60 perspective-1000 mb-5 cursor-pointer" onclick="flipCard(event)">
                        <div id="quiz-card" class="flip-card-inner">
                            <div class="flip-card-front bg-gradient-to-br from-violet-500 to-fuchsia-500 p-5 flex flex-col items-center justify-center text-center shadow-xl border border-white/20">
                                <i data-lucide="help-circle" class="w-10 h-10 text-white/50 mb-3"></i>
                                <p class="text-lg font-bold text-white font-arabicTitle leading-relaxed">${quizItem.q[state.lang]}</p>
                            </div>
                            <div class="flip-card-back bg-white dark:bg-slate-800 p-5 flex flex-col items-center justify-center text-center shadow-xl border border-slate-200 dark:border-slate-700">
                                <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500 mb-3"></i>
                                <p class="text-lg font-bold text-slate-800 dark:text-white font-arabicTitle leading-relaxed">${quizItem.a[state.lang]}</p>
                            </div>
                        </div>
                    </div>

                    <div id="quiz-actions" class="flex flex-col items-center gap-2.5 w-full max-w-sm">
                        <button onclick="flipCard(event)" class="w-full py-2.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold hover:scale-105 active:scale-95 transition-all shadow-sm">${appData.ui.flipBtn[state.lang]}</button>
                        
                        <div id="quiz-score-buttons" class="hidden flex gap-2.5 w-full">
                            <button onclick="answerQuiz(false)" class="flex-1 py-2.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-1">
                                🔄 À revoir
                            </button>
                            <button onclick="answerQuiz(true)" class="flex-1 py-2.5 rounded-full bg-emerald-500 text-white text-xs font-bold hover:bg-emerald-600 active:scale-95 transition-all shadow-md flex items-center justify-center gap-1">
                                ✅ Je savais (+1)
                            </button>
                        </div>
                    </div>
                </div>
            `;
            getEl('app-content').innerHTML = html;
        }

        function flipCard(e) {
            if (e) e.stopPropagation();
            state.quizFlipped = !state.quizFlipped;
            const card = getEl('quiz-card');
            const scoreBtns = getEl('quiz-score-buttons');
            if (card) {
                if (state.quizFlipped) {
                    card.classList.add('flipped');
                    if (scoreBtns) scoreBtns.classList.remove('hidden');
                } else {
                    card.classList.remove('flipped');
                    if (scoreBtns) scoreBtns.classList.add('hidden');
                }
            }
        }

        function answerQuiz(correct) {
            if (correct) state.quizScore++;
            if (state.quizIndex + 1 >= appData.quiz.length) {
                state.quizFinished = true;
            } else {
                state.quizIndex++;
            }
            renderQuiz();
        }

        function resetQuiz() {
            state.quizIndex = 0;
            state.quizScore = 0;
            state.quizFinished = false;
            state.quizFlipped = false;
            renderQuiz();
        }

        function setView(view, groupId = null) {
            state.view = view;
            state.activeGroupId = groupId;
            render();
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = getEl('toast');
            const toastMsg = getEl('toast-msg');
            if (!toast || !toastMsg) return;

            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        // Initialize App
        window.onload = init;
    </script>
</body>
</html>
