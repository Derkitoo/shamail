    <style>
        /* Base Styles */
        html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        body { margin: 0; padding: 0; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Background Pattern */
        .bg-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .bg-pattern { background-image: radial-gradient(#334155 1px, transparent 1px); }

        /* Premium UI Elements */
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.8); }
        
        .premium-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); }
        .dark .premium-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.4); }

        .card-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; opacity: 0.8; }

        /* Accordion Sharh */
        .sharh-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out;
            opacity: 0;
        }
        .sharh-content.open { opacity: 1; }

        /* Quiz Flip Card */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 2rem; }
        .flip-card-back { transform: rotateY(180deg); }

        /* Dictionnaire Gharib & Tooltips */
        .gharib-word { 
            position: relative; 
            display: inline-block; 
            border-bottom: 2px dashed #10b981; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .gharib-word:hover { color: #10b981; }
        
        .tooltip {
            visibility: hidden;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 8px 12px;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.85rem;
            width: max-content;
            max-width: 250px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }
        .gharib-word:hover .tooltip { visibility: visible; opacity: 1; }
        .dark .gharib-word .tooltip { background-color: #334155; }
        .dark .gharib-word .tooltip::after { border-color: #334155 transparent transparent transparent; }

        /* Menu Paramètres */
        #settings-modal {
            backdrop-filter: blur(10px);
            transition: all 0.3s ease-out;
        }
        .settings-open { opacity: 1; pointer-events: auto; }
        .settings-closed { opacity: 0; pointer-events: none; }
        
        /* Ajustements d'accessibilité */
        .text-size-sm { font-size: 0.9rem !important; }
        .text-size-md { font-size: 1.1rem !important; }
        .text-size-lg { font-size: 1.35rem !important; }
        
        /* Mode OLED */
        body.theme-oled { background-color: #000000 !important; color: #e2e8f0; }
        body.theme-oled .glass-panel { background: rgba(0, 0, 0, 0.9) !important; border-color: rgba(255,255,255,0.05); }
        body.theme-oled .bg-slate-900 { background-color: #0a0a0a !important; }
        body.theme-oled .bg-slate-800 { background-color: #111111 !important; }
    </style>
</head>

        let state = {

            settingsContent: document.getElementById('settings-content')
        };

        function init() {
            lucide.createIcons();
            applyTheme();
            applySettings();
            render();
        }

        function applyTheme() {
            if (state.theme === 'dark' || state.settings.isOLED) {
                elements.html.classList.add('dark');
                elements.themeIcon.setAttribute('data-lucide', 'sun');
                if (state.settings.isOLED) {
                    document.body.classList.add('theme-oled');
                } else {
                    document.body.classList.remove('theme-oled');
                }
            } else {
                elements.html.classList.remove('dark');
                document.body.classList.remove('theme-oled');
                elements.themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function toggleTheme() {
            if (state.settings.isOLED) {
                state.settings.isOLED = false;
                localStorage.setItem('shamail_isOLED', 'false');
            }
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('shamail_theme', state.theme);
            applyTheme();
            applySettings();
        }

        function toggleSettings() {
            const modal = elements.settingsModal;
            const content = elements.settingsContent;
            if (modal.classList.contains('settings-closed')) {
                modal.classList.remove('settings-closed');
                modal.classList.add('settings-open');
                setTimeout(() => content.classList.remove('scale-95'), 10);
            } else {
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.remove('settings-open');
                    modal.classList.add('settings-closed');
                }, 200);
            }
        }

        function setTextSize(size) {
            state.settings.textSize = size;
            localStorage.setItem('shamail_textSize', size);
            applySettings();
            render();
        }

        function setFont(font) {
            state.settings.fontFamily = font;
            localStorage.setItem('shamail_fontFamily', font);
            applySettings();
            render();
        }

        function toggleOLED() {
            state.settings.isOLED = !state.settings.isOLED;
            localStorage.setItem('shamail_isOLED', state.settings.isOLED);
            if(state.settings.isOLED && state.theme !== 'dark') {
                state.theme = 'dark';
                localStorage.setItem('shamail_theme', 'dark');
            }
            applySettings();
            applyTheme();
        }

        function applySettings() {
            ['sm', 'md', 'lg'].forEach(s => {
                const btn = document.getElementById(`btn-size-${s}`);
                if(s === state.settings.textSize) {
                    btn.classList.add('bg-white', 'dark:bg-slate-600', 'shadow-sm');
                } else {
                    btn.classList.remove('bg-white', 'dark:bg-slate-600', 'shadow-sm');
                }
            });

            ['Cairo', 'Amiri', 'Noto Naskh Arabic'].forEach(f => {
                const btnId = f === 'Noto Naskh Arabic' ? 'Noto' : f;
                const btn = document.getElementById(`btn-font-${btnId}`);
                if(f === state.settings.fontFamily) {
                    btn.classList.add('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/30');
                    btn.classList.remove('border-transparent', 'bg-slate-50', 'dark:bg-slate-700');
                } else {
                    btn.classList.remove('border-madinah-500', 'bg-madinah-50', 'dark:bg-madinah-900/30');
                    btn.classList.add('border-transparent', 'bg-slate-50', 'dark:bg-slate-700');
                }
            });

            const knob = document.getElementById('oled-knob');
            const bg = document.getElementById('btn-oled');
            if (state.settings.isOLED) {
                knob.style.transform = 'translateX(24px)';
                bg.classList.add('bg-madinah-500');
                bg.classList.remove('bg-slate-300', 'dark:bg-slate-600');
            } else {
                knob.style.transform = 'translateX(0)';
                bg.classList.remove('bg-madinah-500');
                bg.classList.add('bg-slate-300', 'dark:bg-slate-600');
            }
        }

        function toggleLang() {
            state.lang = state.lang === 'fr' ? 'ar' : 'fr';
            localStorage.setItem('shamail_lang', state.lang);
            elements.langBtn.querySelector('span').innerText = state.lang === 'fr' ? 'عربي' : 'FR';
            render();
        }

        function render() {
            const isRtl = state.lang === 'ar';
            elements.html.dir = isRtl ? 'rtl' : 'ltr';
            
            elements.headerLeft.innerHTML = state.view !== 'dashboard' 
                ? `<button onclick="setView('dashboard')" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-inner border border-slate-200 dark:border-slate-700"><i data-lucide="${isRtl ? 'chevron-right' : 'chevron-left'}" class="w-6 h-6 text-slate-600 dark:text-slate-300"></i></button>`
                : `<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-madinah-400 to-madinah-600 flex items-center justify-center shadow-lg shadow-madinah-200 dark:shadow-none"><i data-lucide="book-open" class="w-5 h-5 text-white"></i></div><span class="font-extrabold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-madinah-600 to-emerald-800 dark:from-emerald-400 dark:to-teal-200 font-arabicTitle">${appData.ui.title[state.lang]}</span>`;

            if (state.view === 'dashboard') renderDashboard();
            else if (state.view === 'favorites') renderFavorites();
            else if (state.view === 'quiz') renderQuiz();
            else renderGroup(state.activeGroupId);

            lucide.createIcons();
        }

        function handleSearch(e) {
            state.searchQuery = e.target.value.toLowerCase();
            renderDashboard();
        }

                        </div>
                    </div>

                            <i data-lucide="trending-up" class="w-5 h-5 text-madinah-600 dark:text-madinah-400"></i>

                                <span>${state.readChapters.length} / ${totalChapters}</span>

                            <div class="h-2.5 w-full bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden shadow-inner">
                                <div class="h-full bg-gradient-to-r from-madinah-400 to-teal-500 rounded-full transition-all duration-1000 ease-out" style="width: ${progressPct}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="relative premium-shadow rounded-full">
                        <i data-lucide="search" class="absolute ${isRtl ? 'right-4' : 'left-4'} top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="text" oninput="handleSearch(event)" value="${state.searchQuery}" placeholder="${appData.ui.searchPlaceholder[state.lang]}" class="w-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border border-white/50 dark:border-slate-700 rounded-full py-3.5 ${isRtl ? 'pr-12 pl-4' : 'pl-12 pr-4'} text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-madinah-500 transition-all font-medium placeholder-slate-400">
                    </div>
            `;

            if (state.searchQuery) {
                const results = appData.chapters.filter(c => 
                    c.title.fr.toLowerCase().includes(state.searchQuery) || 
                    c.title.ar.includes(state.searchQuery) ||
                    c.content.fr.toLowerCase().includes(state.searchQuery) ||
                    c.content.ar.includes(state.searchQuery)
                );
                
                if (results.length > 0) {
                    html += `<div class="space-y-4 mt-6">`;
                    results.forEach((chapter, index) => {
                        const group = appData.groups.find(g => g.id === chapter.group_id);
                        html += generateChapterCard(chapter, group, index, isRtl);
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="text-center py-10 text-slate-400"><i data-lucide="search-x" class="w-12 h-12 mx-auto mb-3 opacity-50"></i><p>${appData.ui.noResults[state.lang]}</p></div>`;
                }
            } else {
                html += `<div class="grid grid-cols-2 gap-4 mt-2">`;
                appData.groups.forEach((group, idx) => {
                    html += `
                        <button onclick="setView('group', '${group.id}')" class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl p-5 rounded-[2rem] premium-shadow border border-white/60 dark:border-slate-700 hover:-translate-y-1 hover:shadow-2xl active:scale-95 transition-all text-left flex flex-col h-full group hover:ring-2 hover:ring-madinah-400/50 relative overflow-hidden" style="animation-delay: ${idx * 50}ms; ${isRtl ? 'text-align: right;' : 'text-align: left;'}">
                            <div class="absolute inset-0 bg-gradient-to-br ${group.gradient} opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${group.gradient} flex items-center justify-center shadow-lg mb-4 transform group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300">
                                <i data-lucide="${group.icon}" class="w-7 h-7 text-white"></i>
                            </div>
                            <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-1 font-arabic">${group.title[state.lang]}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed font-medium">${group.desc[state.lang]}</p>
                        </button>
                    `;
                });
                html += `</div>`;
            }

            html += `</div>`;
            elements.content.innerHTML = html;
        }

        function renderGroup(groupId) {
            const group = appData.groups.find(g => g.id === groupId);
            const chapters = appData.chapters.filter(c => c.group_id === groupId);
            const isRtl = state.lang === 'ar';

            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="text-center mb-8 pt-4">
                        <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br ${group.gradient} flex items-center justify-center shadow-2xl mb-5 transform rotate-3 ring-4 ring-white/50 dark:ring-slate-800/50">
                            <i data-lucide="${group.icon}" class="w-10 h-10 text-white"></i>
                        </div>
                        <h2 class="text-3xl font-black text-slate-800 dark:text-white font-arabicTitle mb-2">${group.title[state.lang]}</h2>
                        <p class="text-slate-500 dark:text-slate-400 font-medium">${group.desc[state.lang]}</p>
                    </div>
                    <div class="space-y-5">
            `;
            
            chapters.forEach((chapter, index) => {
                html += generateChapterCard(chapter, group, index, isRtl);
            });

            html += `</div></div>`;
            elements.content.innerHTML = html;
        }

        function generateChapterCard(chapter, group, index, isRtl) {
            const chapterKey = `${group.id}-${chapter.bab}`;
            const isFav = state.favorites.includes(chapterKey);
            const isRead = state.readChapters.includes(chapterKey);
            
            let authBadge = '';
            if (chapter.auth === 'sahih') {
                authBadge = `<span class="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400 text-xs font-bold border border-emerald-200 dark:border-emerald-800/50 flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>صحيح Sahih</span>`;
            } else if (chapter.auth === 'hasan') {
                authBadge = `<span class="px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-400 text-xs font-bold border border-amber-200 dark:border-amber-800/50 flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>حسن Hasan</span>`;
            }

            const fontClass = state.settings.fontFamily === 'Amiri' ? 'font-arabicTitle' : (state.settings.fontFamily === 'Noto Naskh Arabic' ? 'font-arabicNaskh' : 'font-arabic');
            const textSizeClass = `text-size-${state.settings.textSize}`;

            return `
                <div class="group bg-white/90 dark:bg-slate-800/95 backdrop-blur-2xl p-6 rounded-[2rem] premium-shadow border border-white/80 dark:border-slate-700 transition-all duration-500 flex flex-col gap-4 animate-slide-up relative overflow-hidden ${isRead ? 'opacity-80 grayscale-[15%]' : ''} hover:-translate-y-1 hover:shadow-2xl" style="animation-delay: ${index * 50}ms; animation-fill-mode: both;">
                    <div class="card-spine bg-gradient-to-b ${group.gradient}"></div>
                    
                    <div class="flex items-start justify-between pl-2">
                        <div>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 tracking-wider uppercase mb-1 block flex items-center gap-1.5"><i data-lucide="door-open" class="w-3.5 h-3.5"></i> Bâb ${chapter.bab}</span>
                            <h3 class="text-2xl font-bold text-slate-800 dark:text-white ${isRtl ? `${fontClass} ${textSizeClass}` : ''} bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-300">${chapter.title[state.lang]}</h3>
                        </div>
                    </div>
                    
                    <p class="text-[1.05rem] text-slate-600 dark:text-slate-300 leading-relaxed pl-2 ${isRtl ? `${fontClass} ${textSizeClass}` : ''}">${chapter.content[state.lang]}</p>

                    <div class="relative mt-2 bg-gradient-to-br from-slate-50 to-slate-100/50 dark:from-slate-900/80 dark:to-slate-900/40 p-5 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 shadow-inner">
                        <i data-lucide="quote" class="absolute top-4 ${isRtl ? 'left-4' : 'right-4'} w-12 h-12 text-slate-200 dark:text-slate-700/50 opacity-50 pointer-events-none transform ${isRtl ? '-scale-x-100' : ''}"></i>
                        <div class="flex items-center justify-between mb-3 relative z-10">
                            <div class="flex items-center gap-2">
                                <div class="bg-madinah-100 dark:bg-madinah-900/30 p-1.5 rounded-lg border border-madinah-200 dark:border-madinah-800/50">
                                    <i data-lucide="book-text" class="w-4 h-4 text-madinah-600 dark:text-madinah-400"></i>
                                </div>
                                <span class="text-xs font-black uppercase tracking-widest text-madinah-600 dark:text-madinah-400">
                                    ${appData.ui.proof[state.lang]}
                                </span>
                            </div>
                            ${authBadge}
                        </div>
                        <p class="text-[0.95rem] text-slate-700 dark:text-slate-300 leading-relaxed relative z-10 ${isRtl ? `${fontClass} ${textSizeClass}` : 'italic font-medium'}">${chapter.dalil[state.lang]}</p>
                    </div>

                    ${chapter.sharh ? `
                    <div class="mt-1 relative z-10">
                        <button onclick="toggleSharh('${chapterKey}')" class="w-full flex items-center justify-between py-2 px-1 text-slate-500 hover:text-madinah-600 dark:text-slate-400 dark:hover:text-madinah-400 transition-colors text-sm font-bold">
                            <span class="flex items-center gap-2"><i data-lucide="lightbulb" class="w-4 h-4"></i> ${appData.ui.sharhBtn[state.lang]}</span>
                            <i data-lucide="chevron-down" id="sharh-icon-${chapterKey}" class="w-4 h-4 transition-transform duration-300"></i>
                        </button>
                        <div id="sharh-${chapterKey}" class="sharh-content">
                            <div class="p-4 mt-2 bg-indigo-50/50 dark:bg-indigo-900/10 rounded-xl border border-indigo-100/50 dark:border-indigo-800/30 text-slate-700 dark:text-slate-300 text-sm leading-relaxed border-l-4 border-l-indigo-400 ${isRtl ? `border-l-0 border-r-4 border-r-indigo-400 ${fontClass} ${textSizeClass}` : ''}">
                                ${chapter.sharh[state.lang]}
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    ${chapter.action ? `
                    <div class="mt-2 bg-amber-50/80 dark:bg-amber-900/20 p-3 rounded-xl border border-amber-200/50 dark:border-amber-800/30 flex items-start gap-3">
                        <div class="bg-amber-100 dark:bg-amber-900/50 p-1.5 rounded-lg mt-0.5">
                            <i data-lucide="zap" class="w-4 h-4 text-amber-600 dark:text-amber-400"></i>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider block mb-0.5">${appData.ui.sunnahAction[state.lang]}</span>
                            <p class="text-sm font-medium text-slate-700 dark:text-slate-300 ${isRtl ? `${fontClass}` : ''}">${chapter.action[state.lang]}</p>
                        </div>
                    </div>
                    ` : ''}

                    <div class="flex items-center gap-2 mt-2 pt-4 border-t border-slate-100 dark:border-slate-700/50">
                        <button onclick="toggleRead('${chapterKey}')" class="flex-1 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all active:scale-95 ${isRead ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800' : 'bg-slate-50 text-slate-500 hover:bg-slate-100 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700'}">
                            <i data-lucide="${isRead ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>
                            ${appData.ui.markRead[state.lang]}
                        </button>
                        <button onclick="toggleFavorite('${chapterKey}')" class="w-11 h-11 rounded-xl flex items-center justify-center transition-all active:scale-95 ${isFav ? 'bg-rose-100 text-rose-500 dark:bg-rose-900/50 dark:text-rose-400 border border-rose-200 dark:border-rose-800' : 'bg-slate-50 text-slate-400 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700'}">
                            <i data-lucide="heart" class="w-5 h-5 ${isFav ? 'fill-current' : ''}"></i>
                        </button>
                        <button onclick="shareChapter('${chapterKey}')" class="w-11 h-11 rounded-xl bg-slate-50 text-slate-400 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 flex items-center justify-center transition-all active:scale-95">
                            <i data-lucide="share-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleSharh(chapterKey) {
            const content = document.getElementById(`sharh-${chapterKey}`);
            const icon = document.getElementById(`sharh-icon-${chapterKey}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                content.style.maxHeight = null;
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                content.style.maxHeight = content.scrollHeight + "px";
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function toggleFavorite(chapterKey) {
            const idx = state.favorites.indexOf(chapterKey);
            if (idx > -1) {
                state.favorites.splice(idx, 1);
                showToast(appData.ui.removed[state.lang]);
            } else {
                state.favorites.push(chapterKey);
                showToast(appData.ui.saved[state.lang]);
            }
            localStorage.setItem('shamail_favorites', JSON.stringify(state.favorites));
            render();
        }

        function toggleRead(chapterKey) {
            const idx = state.readChapters.indexOf(chapterKey);
            if (idx > -1) {
                state.readChapters.splice(idx, 1);
            } else {
                state.readChapters.push(chapterKey);
            }
            localStorage.setItem('shamail_read', JSON.stringify(state.readChapters));
            render();
        }

        function shareChapter(chapterKey) {
            const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === chapterKey);
            
            // Clean HTML tags from dalil string for sharing
            let dalilClean = chapter.dalil[state.lang].replace(/<[^>]*>?/gm, '');

            const text = `✨ ${chapter.title[state.lang]}\n\n📖 ${chapter.content[state.lang]}\n\n📜 ${appData.ui.proof[state.lang]}: ${dalilClean}\n\n— Shamâ'il App`;
            
            if (navigator.share) {
                navigator.share({ title: chapter.title[state.lang], text: text }).catch(console.error);
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(appData.ui.copied[state.lang]);
                });
            }
        }

        function renderFavorites() {
            const isRtl = state.lang === 'ar';
            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="text-center mb-8 pt-4">
                        <div class="w-16 h-16 mx-auto rounded-full bg-rose-100 dark:bg-rose-900/50 flex items-center justify-center mb-4 text-rose-500">
                            <i data-lucide="heart" class="w-8 h-8 fill-current"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white">${appData.ui.favorites[state.lang]}</h2>
                    </div>
                    <div class="space-y-4">
            `;
            
            if (state.favorites.length === 0) {
                html += `<div class="text-center py-10 text-slate-400">${appData.ui.noFavorites[state.lang]}</div>`;
            } else {
                state.favorites.forEach((key, index) => {
                    const chapter = appData.chapters.find(c => `${c.group_id}-${c.bab}` === key);
                    if (chapter) {
                        const group = appData.groups.find(g => g.id === chapter.group_id);
                        html += generateChapterCard(chapter, group, index, isRtl);
                    }
                });
            }
            html += `</div></div>`;
            elements.content.innerHTML = html;
        }

        function renderQuiz() {
            const isRtl = state.lang === 'ar';
            const quizItem = appData.quiz[state.quizIndex];
            state.quizFlipped = false;

            let html = `
                <div class="animate-fade-in flex flex-col items-center justify-center min-h-[70vh]">
                    <h2 class="text-2xl font-black text-slate-800 dark:text-white mb-8 flex items-center gap-2"><i data-lucide="brain" class="w-6 h-6 text-violet-500"></i> ${appData.ui.quizTitle[state.lang]}</h2>
                    
                    <div class="w-full max-w-sm h-64 perspective-1000 mb-8 cursor-pointer" onclick="flipCard()">
                        <div id="quiz-card" class="flip-card-inner">
                            <div class="flip-card-front bg-gradient-to-br from-violet-500 to-fuchsia-500 p-6 flex flex-col items-center justify-center text-center shadow-2xl border border-white/20">
                                <i data-lucide="help-circle" class="w-12 h-12 text-white/50 mb-4"></i>
                                <p class="text-xl font-bold text-white font-arabicTitle leading-relaxed">${quizItem.q[state.lang]}</p>
                            </div>
                            <div class="flip-card-back bg-white dark:bg-slate-800 p-6 flex flex-col items-center justify-center text-center shadow-2xl border border-slate-200 dark:border-slate-700">
                                <i data-lucide="check-circle" class="w-12 h-12 text-emerald-500 mb-4"></i>
                                <p class="text-xl font-bold text-slate-800 dark:text-white font-arabicTitle leading-relaxed">${quizItem.a[state.lang]}</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="flipCard()" class="px-6 py-3 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold hover:scale-105 transition-all shadow-sm">${appData.ui.flipBtn[state.lang]}</button>
                        <button onclick="nextQuiz()" class="px-6 py-3 rounded-full bg-violet-500 text-white font-bold hover:scale-105 transition-all shadow-md flex items-center gap-2">${appData.ui.nextBtn[state.lang]} <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `;
            elements.content.innerHTML = html;
        }

        function flipCard() {
            state.quizFlipped = !state.quizFlipped;
            const card = document.getElementById('quiz-card');
            if (state.quizFlipped) card.classList.add('flipped');
            else card.classList.remove('flipped');
        }

        function nextQuiz() {
            state.quizIndex = (state.quizIndex + 1) % appData.quiz.length;
            renderQuiz();
        }

        function setView(view, groupId = null) {
            state.view = view;
            state.activeGroupId = groupId;
            render();
        }

        let toastTimeout;
        function showToast(msg) {
            elements.toastMsg.innerText = msg;
            elements.toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                elements.toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        // Initialize App
        window.onload = init;
    </script>
</body>
</html>
