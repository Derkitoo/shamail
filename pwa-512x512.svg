<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="centerGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Card Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad512)"/>
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow512)"/>
  
  <!-- Double Gold Borders -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad512)" stroke-width="8" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGrad512)" stroke-width="2" opacity="0.4"/>

  <!-- Octagram Star Frame -->
  <g transform="translate(256, 230) scale(1.4)">
    <rect x="-80" y="-80" width="160" height="160" rx="16" fill="none" stroke="url(#goldGrad512)" stroke-width="5" opacity="0.9"/>
    <rect x="-80" y="-80" width="160" height="160" rx="16" fill="none" stroke="url(#goldGrad512)" stroke-width="5" opacity="0.9" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldGrad512)" stroke-width="3" stroke-dasharray="6,4" opacity="0.75"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#goldGrad512)" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Sacred Salawat Calligraphy Monogram -->
  <text x="256" y="248" font-family="'Amiri', 'Cairo', 'Traditional Arabic', serif" font-size="115" font-weight="900" fill="url(#goldGrad512)" text-anchor="middle" dominant-baseline="central">ﷺ</text>
  
  <!-- Subtitle Text -->
  <text x="256" y="420" font-family="'Amiri', 'Cairo', serif" font-size="42" font-weight="bold" fill="#ecfdf5" text-anchor="middle" letter-spacing="2">الشمائل المحمدية</text>
</svg>
