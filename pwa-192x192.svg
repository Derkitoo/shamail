<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="centerGlow192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)"/>
  <circle cx="96" cy="96" r="75" fill="url(#centerGlow192)"/>
  <rect x="8" y="8" width="176" height="176" rx="34" fill="none" stroke="url(#goldGrad192)" stroke-width="3" opacity="0.85"/>

  <!-- Octagram Star Frame -->
  <g transform="translate(96, 88) scale(0.55)">
    <rect x="-80" y="-80" width="160" height="160" rx="16" fill="none" stroke="url(#goldGrad192)" stroke-width="5" opacity="0.9"/>
    <rect x="-80" y="-80" width="160" height="160" rx="16" fill="none" stroke="url(#goldGrad192)" stroke-width="5" opacity="0.9" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldGrad192)" stroke-width="3" stroke-dasharray="6,4" opacity="0.75"/>
  </g>

  <!-- Sacred Salawat Calligraphy Monogram -->
  <text x="96" y="94" font-family="'Amiri', 'Cairo', 'Traditional Arabic', serif" font-size="44" font-weight="900" fill="url(#goldGrad192)" text-anchor="middle" dominant-baseline="central">ﷺ</text>
  <text x="96" y="158" font-family="'Amiri', 'Cairo', serif" font-size="16" font-weight="bold" fill="#ecfdf5" text-anchor="middle">الشمائل</text>
</svg>
